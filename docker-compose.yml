services:
  api:
    # The image CMD (docker-entrypoint.sh) runs `alembic upgrade head`
    # against MINDPATTERN_DB_URL before starting uvicorn, so this service is
    # migrated on every deploy without a separate step. A database created by a
    # pre-migrations (create_all-era) deploy must be adopted once with
    # `alembic stamp head` — see backend/alembic/README.md.
    build: ./backend
    environment:
      MINDPATTERN_ENV: production
      MINDPATTERN_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mindpattern}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mindpattern}
      MINDPATTERN_TOKEN_SECRET: ${MINDPATTERN_TOKEN_SECRET:?set a real secret in .env}
      MINDPATTERN_UNLOCK_DAYS: "30"
      # Set to "1" when uvicorn runs with --proxy-headers behind a reverse
      # proxy, so rate limiting uses real client IPs from X-Forwarded-For.
      MINDPATTERN_TRUST_PROXY_HEADERS: "0"
    ports:
      # Loopback-only by default: the API speaks plaintext HTTP and must sit
      # behind a TLS-terminating reverse proxy before it is reachable from
      # a network. Change to "8000:8000" only for trusted local device testing.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Resource limits (2026-09-17): recomputes transiently hold the
    # analysis corpus (bounded by the blob budget, but the ceiling still
    # matters on shared hosts) and scrypt login bursts are 64 MiB each.
    # The ceiling is generous headroom over the measured working set; an
    # OOM-kill here is a DoS against every account on the instance.
    deploy:
      resources:
        limits:
          memory: 1500M
    mem_limit: 1500M
    healthcheck:
      # Same probe as the Dockerfile HEALTHCHECK.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    # Digest-pinned (multi-arch manifest list, resolved 2026-09-07 via the
    # Docker Hub registry API): 16-alpine is a mutable tag, and the database
    # image is the one artifact where a silent swap is worst. Dependabot has
    # no compose-ecosystem digest updates for service images, so bump this
    # digest deliberately when adopting a new postgres:16-alpine build
    # (`docker buildx imagetools inspect postgres:16-alpine`).
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      # From .env — no committed credentials. Example .env:
      #   POSTGRES_PASSWORD=$(openssl rand -hex 16)
      POSTGRES_USER: ${POSTGRES_USER:-mindpattern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mindpattern}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    mem_limit: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindpattern}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    # OPTIONAL — starts only when explicitly requested:
    #   docker compose --profile backups up -d backup
    # A plain `docker compose up` never starts this service.
    #
    # What this gives you: one ENCRYPTED `pg_dump --format=custom` per day
    # into the pgbackups named volume, with files older than
    # BACKUP_RETENTION_DAYS (default 35) deleted after each successful dump.
    #
    # ENCRYPTION (2026-09-16 remediation, finding G1): dumps are piped
    # through `openssl enc -aes-256-cbc -pbkdf2` with a key from
    # BACKUP_KEY (REQUIRED — the service refuses to start without it, so a
    # plaintext dump can never happen by accident). The dump still contains
    # usernames/dates/ciphertext sizes, but a stolen volume/file is now
    # ciphertext at rest. Restore:
    #   openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_KEY \
    #     -in mindpattern-<stamp>.dump.enc | pg_restore --clean ...
    #
    # RETENTION IS PART OF THE DELETION PROMISE. `DELETE /api/account`
    # removes a user from the live database only; every dump taken before
    # the deletion still contains that user's rows until it expires. Set
    # BACKUP_RETENTION_DAYS to the expiry you actually promise users, and
    # keep it short — the default 35 days is a starting point, not a
    # recommendation. Never commit the volume contents; rehearse restores.
    profiles: ["backups"]
    # Same pinned image as `db`: pg_dump's major version must match the
    # server's, and reusing the image keeps the deployment to one artifact.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindpattern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mindpattern}
      # Days to keep dumps. Must match your stated backup-expiry policy —
      # see the retention note above.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      # REQUIRED. Generate once, store in your secret manager / .env:
      #   openssl rand -base64 32
      BACKUP_KEY: ${BACKUP_KEY:?set BACKUP_KEY in .env (openssl rand -base64 32) — dumps are AES-256-CBC-encrypted and the key is mandatory}
    volumes:
      - pgbackups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No image CMD override trickery: a plain POSIX loop. `$$` escapes keep
    # compose from interpolating the loop's own variables. The dump runs
    # BEFORE the first sleep so `up -d backup` proves itself immediately;
    # a failed dump leaves no partial file (writes go to a .tmp and are
    # renamed only after openssl succeeds, so the loop keeps the previous
    # day's file on any failure).
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        # The alpine postgres image ships libcrypto but not always the CLI.
        command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl >/dev/null
        while :; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          out="/backups/mindpattern-$$stamp.dump.enc"
          tmp="$$out.tmp"
          if PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc \
              | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_KEY -out "$$tmp"; then
            mv "$$tmp" "$$out"
            echo "backup: wrote $$out (encrypted)"
            find /backups -name 'mindpattern-*.dump.enc' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
            rm -f /backups/mindpattern-*.dump.tmp
          else
            echo "backup: pg_dump/encrypt failed at $$stamp; keeping previous dumps" >&2
            rm -f "$$tmp"
          fi
          sleep 86400
        done

volumes:
  pgdata:
  # Only created when the backups profile is active. Contents are sensitive
  # (see the backup service comments) and must never enter version control.
  pgbackups:
