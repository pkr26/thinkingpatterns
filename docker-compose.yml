# Production deployment contract.
#
# SECRETS (2026-09-26 infra audit): the token/backup secrets mount as compose
# `secrets:` FILES (0600, never in the container environment, invisible to
# `docker inspect`), consumed via the app's `<VAR>_FILE` resolution — the same
# posture the monitoring stack's bearer token already had. Copy each example
# from deploy/secrets/, fill it, chmod 600:
#
#   mkdir -p deploy/secrets
#   for f in token_secret backup_key postgres_password; do
#     cp deploy/secrets/$f.example deploy/secrets/$f; chmod 600 deploy/secrets/$f
#   done
#   openssl rand -hex 32 > deploy/secrets/token_secret
#   openssl rand -base64 32 > deploy/secrets/backup_key
#   openssl rand -hex 16 > deploy/secrets/postgres_password
#
# POSTGRES_PASSWORD additionally stays in .env: the api service interpolates
# it raw into MINDPATTERN_DB_URL below (compose-level interpolation cannot
# read secret files), so the database container itself reads it from the
# mounted file while the api's copy remains env-based — documented residual,
# rotatable, and lower blast-radius than the signing secrets.
services:
  api:
    # The image CMD (docker-entrypoint.sh) runs `alembic upgrade head`
    # against MINDPATTERN_DB_URL before starting uvicorn, so this service is
    # migrated on every deploy without a separate step. A database created by a
    # pre-migrations (create_all-era) deploy must be adopted once with a
    # `alembic stamp head` — see backend/alembic/README.md.
    # Production deliberately never builds from this checkout.  The release
    # asset supplies this variable as a fully-qualified manifest-list digest
    # (for example ghcr.io/owner/mindpattern@sha256:...).  Keeping `build`
    # out of the deployment file makes the pulled, provenance/SBOM-attested
    # artifact the one that actually runs.  See deploy/README.md for the
    # required verification and docker-compose.dev.yml for local source
    # builds.
    image: ${MINDPATTERN_API_IMAGE:?set MINDPATTERN_API_IMAGE to the API @sha256 reference from the release env asset}

    # 2026-09-21 audit G-7: bounded log rotation (unbounded json-file
    # logs on a busy API can fill the host disk).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Container hardening (2026-09-19 audit, L-85): the app needs no Linux
    # capabilities and must never gain any (cap_drop ALL +
    # no-new-privileges). The root filesystem is read-only — the only
    # writable paths are /tmp (tmpfs) and the mounted volumes below.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      # 2026-09-28 audit H-2: the audit-journal tail anchor. Every
      # committed access-log append also lines out to this file OUTSIDE the
      # database; verification flags a journal ahead of the DB head as tail
      # truncation (deletion of the newest audit rows — invisible to the
      # forward chain alone). The daily sweep compacts it at the retention
      # boundary so it cannot grow unbounded. Threat model (stated
      # honestly): this binds an attacker with DATABASE-only write access;
      # anyone who can write the volume can truncate the anchor too.
      - auditjournal:/var/lib/mindpattern/audit
    secrets:
      - token_secret
      - metrics_token
    environment:
      # POSTGRES_PASSWORD is interpolated RAW into this URL: it must be a
      # hex string (openssl rand -hex 16, as the db service example shows)
      # or another charset with no URL-reserved characters (: / @ # ? %).
      # A password containing any of those would silently corrupt the
      # connection URL — enforce hex-only generation in your secret store
      # (2026-09-19 audit, L-86).
      MINDPATTERN_ENV: production
      MINDPATTERN_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-mindpattern}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mindpattern}
      # The signing secret reads from the mounted file (empty env var falls
      # through to <VAR>_FILE in app.config); the dev overlay may keep the
      # plain env form.
      MINDPATTERN_TOKEN_SECRET: ${MINDPATTERN_TOKEN_SECRET:-}
      MINDPATTERN_TOKEN_SECRET_FILE: /run/secrets/token_secret
      MINDPATTERN_AUTH_TOKEN_SECRET_FILE: /run/secrets/auth_token_secret
      # Independent audit 2026-09-27: the metrics bearer token was the
      # last secret still delivered as a plain env var (docker-inspect
      # readable). It now rides the same file-mount chain as everything
      # else; MINDPATTERN_METRICS_TOKEN env stays supported for dev.
      MINDPATTERN_METRICS_TOKEN: ${MINDPATTERN_METRICS_TOKEN:-}
      MINDPATTERN_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # The audit journal path on the named volume below (2026-09-28 audit
      # H-2 — the anchor existed but was never wired, so production ran
      # without tail-truncation detection). The app user owns the mount
      # via the Dockerfile's directory ownership.
      MINDPATTERN_AUDIT_JOURNAL: /var/lib/mindpattern/audit/journal.log
      MINDPATTERN_UNLOCK_DAYS: "30"
      # Safe forwarding is opt-in: the app accepts X-Forwarded-For only when
      # the direct peer also matches this explicit IP/CIDR allowlist. Do not
      # use uvicorn --proxy-headers; the app validates the raw peer itself.
      MINDPATTERN_TRUST_PROXY_HEADERS: ${MINDPATTERN_TRUST_PROXY_HEADERS:-0}
      MINDPATTERN_TRUSTED_PROXY_IPS: ${MINDPATTERN_TRUSTED_PROXY_IPS:-}
    ports:
      # Loopback-only by default: the API speaks plaintext HTTP and must sit
      # behind a TLS-terminating reverse proxy before it is reachable from
      # a network. Change to "8000:8000" only for trusted local device testing.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Resource limits (2026-09-17): recomputes transiently hold the
    # analysis corpus (bounded by the blob budget, but the ceiling still
    # matters on shared hosts) and scrypt login bursts are 128 MiB each.
    # The ceiling is generous headroom over the measured working set; an
    # OOM-kill here is a DoS against every account on the instance.
    # 2026-09-26 audit M-I3: a memory-only ceiling leaves CPU and process
    # count unbounded — a fork-leaking dependency or a CPU-bound tight
    # loop starves the host the same way. cpus matches the two-worker
    # reality (one analyze slot + one serving loop with headroom);
    # pids_limit 256 is far above uvicorn's real usage and contains any
    # fork bomb inside the container's cgroup. Single top-level form only
    # (mem_limit/cpus/pids_limit — the enforced-by-compose keys); the
    # duplicate deploy.resources blocks were removed 2026-09-26 to keep
    # exactly one source of truth per limit.
    mem_limit: 1500M
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      # Same readiness probe as the Dockerfile HEALTHCHECK.  /healthz proves
      # only that Python is alive; /readyz also proves DB connectivity and
      # that Alembic reached the required schema head.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    # Digest-pinned (multi-arch manifest list, re-resolved 2026-09-26 via the
    # Docker Hub registry API — previous pin 2026-09-07): 16-alpine is a
    # mutable tag, and the database image is the one artifact where a silent
    # swap is worst. Dependabot has no compose-ecosystem digest updates for
    # service images, so bump this digest deliberately when adopting a new
    # postgres:16-alpine build (`docker buildx imagetools inspect
    # postgres:16-alpine`); deploy/monitoring/check-image-drift.sh gates
    # staleness in CI.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea

    # 2026-09-21 audit G-7: bounded log rotation (unbounded json-file
    # logs on a busy API can fill the host disk).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - postgres_password
    environment:
      # From the mounted secret file (native POSTGRES_PASSWORD_FILE support)
      # — the password never appears in this container's environment. The
      # .env copy exists only for the api service's URL interpolation.
      POSTGRES_USER: ${POSTGRES_USER:-mindpattern}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-mindpattern}
    # Hardening (2026-09-19 audit, L-85) with one documented carve-out
    # (2026-09-26 infra audit, I-3): the official entrypoint's
    # docker_setup_env → pg_setup_hba_conf path chown's PGDATA and then
    # `exec gosu postgres` — both need a minimal capability set to run as
    # root before dropping privileges (docker-library/postgres#649).
    # cap_drop ALL with NO cap_add crash-loops the container (EPERM), so
    # the five POSIX file-ownership/identity capabilities are explicitly
    # re-added — the minimal set the pinned entrypoint exercises; nothing
    # beyond it (no NET_ADMIN, no SYS_*). The root filesystem stays
    # read-only; the data directory lives on the pgdata volume, /tmp and
    # the socket dir get tmpfs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /var/run/postgresql:size=16m,mode=1777
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # 2026-09-26 audit M-I3: db gets the same CPU ceiling as the api (its
    # workload is the api's, amplified by recompute bursts) but a HIGHER
    # pids ceiling — every client connection is a backend process, so
    # 512 keeps real headroom above peak connections while still
    # containing a runaway. Single top-level form (see api's note).
    mem_limit: 1G
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindpattern}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    # OPTIONAL — starts only when explicitly requested:
    #   docker compose --profile backups up -d backup
    # A plain `docker compose up` never starts this service.
    #
    # What this gives you: one ENCRYPTED `pg_dump --format=custom` per day
    # into the pgbackups named volume. Files older than
    # BACKUP_RETENTION_DAYS (default 35) are pruned before every attempt,
    # including retries after a failed dump.
    #
    # ENCRYPTION (2026-09-16 remediation, finding G1): dumps are piped
    # through `openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000` with a
    # key from the mounted BACKUP_KEY secret file (REQUIRED — the service
    # refuses to start without it, so a plaintext dump can never happen by
    # accident). `-iter` is explicit (2026-09-19 hardening) because
    # openssl's -pbkdf2 default is only 10k iterations; 600k matches OWASP's
    # PBKDF2-SHA-256 floor, and every decrypt side (restore example below,
    # rehearse_restore.sh, CI) must pass the SAME count or decryption
    # fails. The dump still contains usernames/dates/ciphertext sizes, but
    # a stolen volume/file is now ciphertext at rest. Restore:
    #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
    #     -pass file:deploy/secrets/backup_key \
    #     -in mindpattern-<stamp>.dump.enc | pg_restore --clean ...
    #
    # RETENTION IS PART OF THE DELETION PROMISE. `DELETE /api/account`
    # removes a user from the live database only; every dump taken before
    # the deletion still contains that user's rows until it expires. Set
    # BACKUP_RETENTION_DAYS to the expiry you actually promise users, and
    # keep it short — the default 35 days is a starting point, not a
    # recommendation. Never commit the volume contents; rehearse restores.
    profiles: ["backups"]
    # This is the separately attested backup-worker image, supplied by the
    # release env asset as an immutable @sha256 reference.  Do not add a
    # source `build` stanza here: a production backup must use the same
    # reviewed artifact whose SBOM/provenance was published with the API.
    image: ${MINDPATTERN_BACKUP_IMAGE:?set MINDPATTERN_BACKUP_IMAGE to the backup @sha256 reference from the release env asset}

    # 2026-09-21 audit G-7: bounded log rotation (unbounded json-file
    # logs on a busy API can fill the host disk).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    secrets:
      - backup_key
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindpattern}
      # pg_dump reads the database password from a pgpass line the
      # entrypoint builds on the tmpfs from the mounted secret (see the
      # entrypoint) — no database credential in this container's
      # environment.
      PGPASSFILE: /tmp/pgpass
      POSTGRES_DB: ${POSTGRES_DB:-mindpattern}
      # Days to keep dumps. Must match your stated backup-expiry policy —
      # see the retention note above.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      # The dump-encryption key: mounted file preferred (2026-09-26 infra
      # audit); the env form remains as the dev-overlay fallback.
      BACKUP_KEY: ${BACKUP_KEY:-}
      BACKUP_KEY_FILE: /run/secrets/backup_key
    volumes:
      - pgbackups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # 2026-09-26 audit follow-up (B1): the M-I3 container-limit pass
    # missed this service — a stuck dump|encrypt loop is exactly the
    # CPU-saturating class those limits exist to contain on the shared
    # host, and this worker had NO memory limit either. pg_dump is bursty:
    # 1 CPU / 512 MiB is generous for a daily dump while the co-located
    # DB keeps its headroom. (The dev overlay inherits these via merge.)
    mem_limit: 512M
    cpus: 1.0
    pids_limit: 64
    # No image CMD override trickery: a plain POSIX loop. `$$` escapes keep
    # compose from interpolating the loop's own variables. The dump runs
    # BEFORE the first sleep so `up -d backup` proves itself immediately;
    # a failed dump leaves no partial file (writes go to a .tmp and are
    # renamed only after encryption AND a keyed integrity tag succeed, so the
    # loop keeps the previous day's file on any failure).  AES-CBC alone is
    # confidential but malleable; the sidecar HMAC makes tampering detectable
    # before a restore attempts to decrypt the dump.
    # Hardened like its siblings (2026-09-19 audit, L-85): no capabilities,
    # no privilege escalation, read-only rootfs — dumps land on the
    # pgbackups volume, scratch space in tmpfs.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    entrypoint:
      - sh
      - -c
      - |
        # A successful encryptor can otherwise mask a failed pg_dump in a
        # shell pipeline (it would faithfully encrypt an empty/truncated
        # stream).  BusyBox ash in the pinned Alpine image supports pipefail;
        # make that guarantee explicit before treating a dump as valid.
        set -eu
        set -o pipefail
        # `openssl enc -out` creates the ciphertext temporary file itself;
        # the final artifact inherits that mode through mv.  Docker's normal
        # process umask may be 022, so make every dump artifact owner-only
        # rather than relying on volume mount isolation alone. The HMAC
        # sidecar also explicitly opens mode 0600 in backup_mac.py.
        umask 077
        command -v openssl >/dev/null 2>&1 && command -v mindpattern-backup-mac >/dev/null 2>&1 || {
          echo "backup image is missing its required crypto utilities" >&2
          exit 1
        }
        # Dump-encryption key source (2026-09-26 infra audit): the mounted
        # secret file when present, else the env var (dev overlay).
        if [ -s "$$BACKUP_KEY_FILE" ]; then
          backup_pass="file:$$BACKUP_KEY_FILE"
        elif [ -n "$$BACKUP_KEY" ]; then
          backup_pass="env:BACKUP_KEY"
        else
          echo "no BACKUP_KEY file or env value — refusing to dump plaintext" >&2
          exit 1
        fi
        # Database credential: build the pgpass line from the mounted
        # postgres_password secret (raw password -> db:5432:db:user:pass)
        # on the tmpfs, mode 600 — pg_dump then authenticates without the
        # password ever living in this container's environment. The env
        # fallback (PGPASSWORD via the dev overlay) stays for local builds.
        if [ -s /run/secrets/postgres_password ]; then
          pgpass_file="$$PGPASSFILE"
          printf 'db:5432:%s:%s:%s\n' "$$POSTGRES_DB" "$$POSTGRES_USER" \
            "$$(cat /run/secrets/postgres_password)" > "$$pgpass_file"
          chmod 600 "$$pgpass_file"
        fi
        case "$$BACKUP_RETENTION_DAYS" in
          ''|*[!0-9]*)
            echo "BACKUP_RETENTION_DAYS must be a positive whole number" >&2
            exit 1
            ;;
        esac
        if [ "$$BACKUP_RETENTION_DAYS" -lt 1 ]; then
          echo "BACKUP_RETENTION_DAYS must be at least 1" >&2
          exit 1
        fi
        cleanup_backup_artifacts() {
          # Retention is a deletion promise, not a success-path nicety. Run
          # it before EVERY attempt so an outage cannot indefinitely retain
          # expired account data; a cleanup error stops/restarts the worker
          # loudly instead of silently violating the policy.
          mindpattern-backup-mac prune /backups "$$BACKUP_RETENTION_DAYS"
          find /backups -name 'mindpattern-*.dump.enc.tmp' -delete
          find /backups -name 'mindpattern-*.dump.enc.hmac.tmp' -delete
        }
        while :; do
          sleep_seconds=86400
          cleanup_backup_artifacts
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          out="/backups/mindpattern-$$stamp.dump.enc"
          tmp="$$out.tmp"
          mac="$$out.hmac"
          mac_tmp="$$mac.tmp"
          if pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc \
              | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass "$$backup_pass" -out "$$tmp" \
              && mindpattern-backup-mac write "$$tmp" "$$mac_tmp"; then
            # Sidecar first, ciphertext last: a visible final .dump.enc is
            # therefore never left without its integrity tag if the process
            # is killed between publication steps. An orphan tag is harmless.
            mv "$$mac_tmp" "$$mac"
            mv "$$tmp" "$$out"
            echo "backup: wrote $$out (encrypted + authenticated)"
          else
            echo "backup: pg_dump/encrypt/authenticate failed at $$stamp; keeping previous dumps" >&2
            find /backups -name "mindpattern-$$stamp.dump.enc.tmp" -delete
            find /backups -name "mindpattern-$$stamp.dump.enc.hmac.tmp" -delete
            # A transient database/DNS/disk failure must not create a 24-hour
            # recovery-point gap. Retry with a bounded delay while preserving
            # previously published authenticated backups.
            sleep_seconds=300
          fi
          sleep "$$sleep_seconds"
        done

volumes:
  pgdata:
  # Only created when the backups profile is active. Contents are sensitive
  # (see the backup service comments) and must never enter version control.
  pgbackups:
  # The api's audit-journal tail anchor (2026-09-28 audit H-2): append-only
  # lines mirroring committed access-log rows, outside the database. Compact
  # only via the app's daily sweep (retention-aligned); it is tamper
  # EVIDENCE, not authoritative state.
  auditjournal:

# File-mounted secrets (2026-09-26 infra audit): copy the examples from
# deploy/secrets/, fill, chmod 600. The api's auth_token_secret file is
# OPTIONAL (an empty file means "derive from token_secret" — the app's
# documented legacy-derivation path), so the example may stay empty.
secrets:
  token_secret:
    file: ${MINDPATTERN_SECRETS_DIR:-./deploy/secrets}/token_secret
  auth_token_secret:
    file: ${MINDPATTERN_SECRETS_DIR:-./deploy/secrets}/auth_token_secret
  postgres_password:
    file: ${MINDPATTERN_SECRETS_DIR:-./deploy/secrets}/postgres_password
  backup_key:
    file: ${MINDPATTERN_SECRETS_DIR:-./deploy/secrets}/backup_key
  # Independent audit 2026-09-27: the api's metrics bearer token. The
  # monitoring stack reads its COPY of the same value from
  # deploy/monitoring/token (prometheus bearer_token_file) — generate ONE
  # value into both files (the CI jobs assert this for their own
  # generated set).
  metrics_token:
    file: ${MINDPATTERN_SECRETS_DIR:-./deploy/secrets}/metrics_token
