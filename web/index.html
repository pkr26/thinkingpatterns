<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- A mental-health journal must never end up in a search index or a
         referrer graph, even before the header set applies. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- A header is also shipped in public/_headers for static hosts (and
         by nginx in production). The meta policy is a defense-in-depth
         fallback when a host is mis-set. Pinned by
         tests/securityConfig.test.ts. No 'unsafe-inline' anywhere: the
         single stylesheet is the same-origin /app.css and all dynamic
         styling is React's CSSOM inline-style path, which style-src does
         not govern. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'none'; upgrade-insecure-requests"
    />
    <title>MindPattern</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
