# Local development overlay only.  Always combine it with docker-compose.yml:
#
#   docker compose --env-file .env \
#     -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The base compose file intentionally contains no source builds so a
# production deployment can only consume release-image references.  These
# two `build` stanzas are therefore kept in a separate, explicit overlay.
# `.env` still needs the two image variables because Compose expands the base
# file before it applies this overlay; use the local tags shown in README.md.
services:
  api:
    build:
      context: ./backend
    image: ${MINDPATTERN_API_IMAGE:?set MINDPATTERN_API_IMAGE to mindpattern-api:local for the development overlay}
    # VOICE_PLAN (2026-09-29): dev parity for the S3 audio store — point the
    # API at the MinIO service below. The bucket is created lazily by hand
    # (mc mb) or by your provisioning; the local-dir fallback still works
    # without any of this.
    environment:
      MINDPATTERN_AUDIO_ENABLED: "true"
      MINDPATTERN_AUDIO_BUCKET: mindpattern-audio-dev
      MINDPATTERN_AUDIO_BUCKET_REGION: us-east-1
      # M4 remediation (audit 2026-09-29): without an endpoint override
      # boto3 resolves the bucket against REAL AWS and the dev
      # round-trip can never work. Path-style addressing is applied
      # automatically when the endpoint is set.
      MINDPATTERN_AUDIO_S3_ENDPOINT: http://audio-minio:9000
      MINDPATTERN_AWS_ACCESS_KEY_ID: minioadmin
      MINDPATTERN_AWS_SECRET_ACCESS_KEY: minioadmin
      MINDPATTERN_STT_URL: ${MINDPATTERN_STT_URL:-}
      MINDPATTERN_STT_API_KEY: ${MINDPATTERN_STT_API_KEY:-}
    depends_on:
      - audio-minio

  backup:
    build:
      context: ./backup
    image: ${MINDPATTERN_BACKUP_IMAGE:?set MINDPATTERN_BACKUP_IMAGE to mindpattern-backup:local for the development overlay}

  # S3-compatible scratch object store for kept voice recordings in dev
  # (docs/plans/voice-plan.md P2). NOT part of any production deployment: production
  # points MINDPATTERN_AUDIO_BUCKET at a real, dedicated bucket with
  # least-privilege IAM credentials supplied via compose secrets.
  audio-minio:
    # The former Docker Hub release was removed upstream and clean CI runners
    # could not pull it. This current Chainguard MinIO index was pulled and
    # smoke-tested on both the S3 readiness endpoint and a named /data volume;
    # the digest makes the otherwise-moving free `latest` channel immutable.
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - audio-minio-data:/data
    healthcheck:
      # The minimal image intentionally has no curl/mc client. Its bash has
      # /dev/tcp, so probe MinIO's own readiness route without adding another
      # mutable helper image.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /minio/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200 OK'* ]]"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  audio-minio-data:
