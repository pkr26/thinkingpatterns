[project]
name = "mindpattern-backend"
version = "1.0.0"
description = "Encrypted journaling API and deterministic pattern analysis"
requires-python = ">=3.12"
dependencies = [
    # Keep direct pins aligned with requirements.in; update both together.
    "aiosqlite==0.22.1",
    "alembic==1.19.2",
    "boto3==1.40.11",
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "greenlet==3.3.2",
    "httpx==0.28.1",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
postgres = ["asyncpg==0.30.0"]
dev = [
    # Keep development pins aligned with requirements.dev.in.
    "hypothesis==6.168.2",
    "mypy==2.3.1",
    "mutmut==2.4.4",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# CI checks syntax, unused names, whitespace, and consistent import ordering.
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Some test modules intentionally import fixtures without referencing them.
"tests/**" = ["F401"]

[tool.ruff.lint.isort]
# The local migration directory is not the installed Alembic package.
known-third-party = ["alembic"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "."
files = ["app"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
strict_equality = true
# Type checking covers every application module.

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
# Reserve `slow` for the cross-platform KDF and encryption vectors allowed
# by tests/test_audit_round3_2026_09_22.py. Mutation runs exclude this marker,
# so expanding it also requires updating that regression guard deliberately.
markers = ["slow: slow tests excluded from mutation-testing runs"]

[tool.mutmut]
# Exclude declarative models: SQLite cannot exercise every production DDL
# constraint. LLM sanitization remains in scope through its mocked HTTP seam.
paths_to_mutate = "app/security/,app/services/,app/api/,app/middleware.py,app/cache.py,app/config.py,app/deps.py,app/db.py,app/main.py,app/schemas.py"
tests_dir = "tests/"
runner = "bash scripts/mutmut_runner.sh"
