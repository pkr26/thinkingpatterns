# Alembic configuration. sqlalchemy.url is intentionally ABSENT here:
# alembic/env.py resolves the database URL from the exact same source as the
# running application (app.config.Settings.from_env → MINDPATTERN_DB_URL),
# so migrations can never drift onto a different database than the app uses.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
