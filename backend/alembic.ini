# Alembic configuration. sqlalchemy.url is intentionally ABSENT here:
# alembic/env.py reads the MINDPATTERN_DB_URL environment variable directly
# (not through app.config — importing the app package inside the migration
# process would drag the whole application config graph in). Same variable
# the application resolves, so migrations cannot drift onto a different
# database than the app uses; absent → the same SQLite dev default.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
