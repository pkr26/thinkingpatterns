  #     # S3 — inside the renewal window (warning): Lets Encrypt-style certs
  #     # renew ~monthly on a 90d life; 14d means several failed renewals
  #     # already. time()-based arithmetic: after expiry the difference is
  #     # negative, so an already-expired cert also trips BOTH rules.
