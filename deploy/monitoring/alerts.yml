  # --------------------------------------------------------------------
  # OPTIONAL: TLS certificate expiry via the blackbox exporter's tls
  # module. Uncomment ONLY if you enabled the `blackbox` profile AND the
  # mindpattern-blackbox-tls scrape job in prometheus.yml (that job uses
  # the `tls` module from blackbox-modules.yml; replace its
  # portal.example.com/app.example.com target literals with your real
  # origins). probe_ssl_earliest_cert_expiry comes from the exporter, not
  # from metrics.py.
