  # the `node` profile (node-exporter service in the monitoring
  # docker-compose.yml) and the mindpattern-node scrape job in
  # prometheus.yml — without the exporter running this would reference
  # series that never exist (harmless, but dishonest on the targets page).
  # The node_* series come from the exporter, not from metrics.py.
  # --------------------------------------------------------------------
