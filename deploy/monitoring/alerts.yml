# Prometheus rules for the MindPattern API.
#
# OPERATOR TOOLING — same status as deploy/monitoring/prometheus.yml: opt-in,
# outside the digest-pinned release contract (see deploy/monitoring/README.md).
#
# Every expression below uses ONLY metric names backend/app/metrics.py
# actually renders (this is machine-checked by deploy/monitoring/verify.sh):
#
#   mindpattern_requests_total{status="2xx"|"3xx"|"4xx"|"5xx"}      counter
#   mindpattern_recompute_seconds_bucket{le="0.25"|"0.5"|"1.0"|"2.0"|"5.0"|"15.0"|"60.0"|"+Inf"}
#   mindpattern_recompute_seconds_count / mindpattern_recompute_seconds_sum
#   mindpattern_llm_calls_total{outcome="success"|"failure"}        counter
#   mindpattern_keystore_sessions                                   gauge
#   mindpattern_audit_chain_failures                                counter
#   mindpattern_audit_journal_failures_total                        counter
#   mindpattern_audit_maintenance_failures_total                    counter
#   mindpattern_audit_prune_backlog                                 gauge
#   mindpattern_audit_prune_pending_rows_probe                      gauge
#   mindpattern_audit_prune_oldest_overdue_seconds                  gauge
#   mindpattern_audit_verification_backlog                          gauge
#   mindpattern_audit_verification_pending_owners_probe             gauge
#   mindpattern_audit_verification_cycle_age_seconds                gauge
#   mindpattern_audio_deletion_backlog                              gauge
#   mindpattern_audio_deletion_oldest_seconds                       gauge
#   mindpattern_account_deletion_pending_probe                      gauge
#   mindpattern_account_deletion_oldest_seconds                     gauge
#   mindpattern_account_deletion_failures_total{category}           counter
#
# plus Prometheus' own `up` (and `probe_success` if the blackbox job is
# enabled), and — ONLY inside the commented optional sections at the
# bottom — the blackbox tls module's `probe_ssl_earliest_cert_expiry` and
# the node_exporter filesystem series, grounded by their exporters rather
# than by metrics.py. Two facts about the hand-rolled exposition, which the
# queries account for:
#   * a status family series appears only after its first response is
#     observed — an absent {status="5xx"} numerator makes the ratio
#     expression empty (correctly "no alert"), never zero-division noise;
#   * le labels render as "0.25" … "5.0" … "+Inf" (Python str(float));
#     histogram_quantile parses them as floats, so this is legal PromQL.
#
# SEVERITY MAPPING (docs/INCIDENT_RUNBOOK.md matrix; details in README.md):
#   S2  service unusable — API down, 5xx storm, readyz failing; also the
#       imminent-outage host cases: disk almost full (Postgres writes /
#       log volumes fail), TLS cert hours from expiry
#   S3  degraded — slow recomputes, LLM failure ratio; also time-bounded
#       host decay: disk filling up, cert inside the renewal window
#   The keystore alert starts at S2 and ESCALATES to S1 per the runbook's
#   plaintext-exposure checklist, which names this exact metric.

groups:
  - name: mindpattern-api
    rules:
      # S2 — runbook "S2: API down". up==0 means the /metrics scrape fails:
      # either the API process is down, or (check FIRST) the token/network
      # wiring broke — a wrong MINDPATTERN_METRICS_TOKEN looks identical.
      - alert: MindPatternAPIDown
        expr: |
          up{job="mindpattern-api"} == 0
        for: 2m
        labels:
          severity: S2
        annotations:
          summary: "API metrics target down (scrape failing for 2m)"
          runbook: "docs/INCIDENT_RUNBOOK.md — S2: API down (first confirm the token is not the cause; a 401 on /metrics is an S3, a dead process is an S2)"

      # S2 — runbook S2 lists "recomputes 500ing". 5m rate of the 5xx family
      # against ALL families, >5% sustained 10m, with a minimal-traffic
      # floor (>4 requests per 5m) so a near-idle instance does not page on
      # one stray failure.
      - alert: MindPatternHigh5xxRatio
        expr: |
          (
            sum(rate(mindpattern_requests_total{status="5xx"}[5m]))
              /
            clamp_min(sum(rate(mindpattern_requests_total[5m])), 1e-9)
          ) > 0.05
            and
          sum(increase(mindpattern_requests_total[5m])) > 4
        for: 10m
        labels:
          severity: S2
        annotations:
          summary: "More than 5% of API responses are 5xx for 10m"
          runbook: "docs/INCIDENT_RUNBOOK.md — S2 (container logs for tracebacks; a 5xx storm from recomputes is the listed S2 example)"

      # S3 — runbook S2/S3 boundary: "mindpattern_recompute_seconds p95
      # climbing past ~5s means the analyze slots are saturated". The
      # threshold 5s matches an actual bucket edge (le="5.0"). With zero
      # recomputes in the window all bucket rates are zero and the quantile
      # is NaN — no alert, correctly.
      - alert: MindPatternRecomputeP95Slow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(mindpattern_recompute_seconds_bucket[10m]))
          ) > 5
        for: 10m
        labels:
          severity: S3
        annotations:
          summary: "Recompute p95 above 5s for 10m — analyze slots saturating"
          runbook: "docs/INCIDENT_RUNBOOK.md — S3 (shed load via MINDPATTERN_PROCESSING_RATE_LIMIT; do NOT scale to a second instance)"

      # S2, escalate to S1 — the runbook's plaintext-exposure checklist step
      # names this exact gauge. Sessions are TTL-bounded (<=5 min) and
      # purged on every mint/get/pop, per-account cap 4, analyze limiter 4
      # concurrent. A gauge above 16 = 4x the analyze slots, held for 15m =
      # three full TTL windows, means data keys are being minted and NOT
      # consumed — the plaintext-retention precondition, not yet proof of
      # exposure.
      - alert: MindPatternKeystoreSessionsStuck
        expr: |
          mindpattern_keystore_sessions > 16
        for: 15m
        labels:
          severity: S2
        annotations:
          summary: "Processing sessions not being consumed (>16 for 15m)"
          runbook: "docs/INCIDENT_RUNBOOK.md — S1 checklist step 2 (this metric, sustained high); escalate to S1 only if the checklist confirms exposure"

      # S3 — LLM egress is consent-gated enrichment; core journaling works
      # without it. Ratio over 15m with an absolute floor of >2 calls in the
      # window so one failed call on a quiet instance does not page. The
      # failure counter series only exists after the first failure; no
      # failures -> empty expression -> no alert.
      - alert: MindPatternLLMFailureRatioHigh
        expr: |
          (
            sum(rate(mindpattern_llm_calls_total{outcome="failure"}[15m]))
              /
            clamp_min(sum(rate(mindpattern_llm_calls_total[15m])), 1e-9)
          ) > 0.25
            and
          sum(increase(mindpattern_llm_calls_total[15m])) > 2
        for: 15m
        labels:
          severity: S3
        annotations:
          summary: "More than 25% of LLM calls failing for 15m"
          runbook: "docs/INCIDENT_RUNBOOK.md — S3 (provider degraded); the S1 LLM path is about exposure, not failure ratio"

      # S2 — audit-chain verification failure (2026-09-28 audit gap: the
      # counter existed but no alert read it). The daily sweep verifies the
      # access log's forward hash chain + the journal tail anchor and
      # increments this counter per FAILED patient chain (not per row —
      # one tampered trail is one signal however many rows it has). ANY
      # increase inside an hour means the tamper-evidence guarantee over
      # who accessed what is broken: the chain is evidence for breach
      # notification, so its own integrity loss is service-unusable class,
      # not a background hiccup. The counter only moves on verification
      # runs, so a quiet hour on a healthy instance is correctly silent.
      - alert: MindPatternAuditChainFailures
        expr: |
          increase(mindpattern_audit_chain_failures[1h]) > 0
        for: 0m
        labels:
          severity: S2
        annotations:
          summary: "Audit-chain verification failed for at least one patient trail in the last hour"
          runbook: "docs/INCIDENT_RUNBOOK.md — S2; the breach-assessment section names the chain verification as evidence — preserve the verification output and treat the tampered window as potentially-accessed until reconciled"

      # S2 — every increment is a failed durable append or compaction of the
      # out-of-database audit anchor. The application also drops readiness
      # until a later fsynced operation succeeds, while this counter preserves
      # a release-visible signal even after recovery. A five-minute lookback
      # avoids paging forever on a recovered monotonic counter.
      - alert: MindPatternAuditJournalFailure
        expr: |
          increase(mindpattern_audit_journal_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: S2
        annotations:
          summary: "Audit journal append or compaction failed in the last 5m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audit-journal failure (preserve the journal and chain evidence, restore the original durable volume, and require /readyz recovery)"

      # S2 — a bounded retention/verification pass failed and readiness is
      # held closed until an authenticated pass succeeds. Unlike the backlog
      # gauges, this catches invalid key rings, database faults, and journal-
      # index failures immediately even when there is no retained backlog.
      - alert: MindPatternAuditMaintenanceFailure
        expr: |
          increase(mindpattern_audit_maintenance_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: S2
        annotations:
          summary: "Authenticated audit maintenance failed in the last 15m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audit-maintenance backlog/failure (preserve evidence, restore the original key/journal/database inputs, and require a complete successful pass before reopening)"

      # S3 — cooperative catch-up should normally consume many fixed-size
      # pages inside this window. A persistent boolean means expiration work
      # is arriving faster than it drains or a very large legacy backlog is
      # consuming its request-headroom budget.
      - alert: MindPatternAuditPruneBacklogPersistent
        expr: |
          mindpattern_audit_prune_backlog > 0
        for: 30m
        labels:
          severity: S3
        annotations:
          summary: "Audit-retention pruning has remained backlogged for 30m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audit-maintenance backlog/failure (confirm the bounded cursor is advancing; never bypass authenticated verification to drain faster)"

      # S2 — this is age beyond the configured retention cutoff, not row age.
      # Two hours is well beyond the one-second catch-up cadence and turns a
      # maintenance-capacity problem into a missed deletion commitment.
      - alert: MindPatternAuditPruneOldestOverdue
        expr: |
          mindpattern_audit_prune_oldest_overdue_seconds > 2 * 60 * 60
        for: 15m
        labels:
          severity: S2
        annotations:
          summary: "Oldest access-audit row is over 2h beyond its retention cutoff"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audit-maintenance backlog/failure (treat as a retention incident; preserve cursor and chain evidence while restoring bounded catch-up)"

      # S3 — verification uses its own durable cursor and fixed row budget.
      # A persistent cycle is visible independently from deletion progress.
      - alert: MindPatternAuditVerificationBacklogPersistent
        expr: |
          mindpattern_audit_verification_backlog > 0
        for: 30m
        labels:
          severity: S3
        annotations:
          summary: "Incremental audit verification has remained backlogged for 30m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audit-maintenance backlog/failure (confirm the verification cursor is advancing and the snapshot is not restarting continuously)"

      # S2 — a two-hour incomplete authenticated verification cycle leaves
      # retained access evidence without timely end-to-end validation even if
      # individual pages still succeed.
      - alert: MindPatternAuditVerificationCycleStalled
        expr: |
          mindpattern_audit_verification_cycle_age_seconds > 2 * 60 * 60
        for: 15m
        labels:
          severity: S2
        annotations:
          summary: "Incremental audit verification cycle has remained incomplete over 2h"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audit-maintenance backlog/failure (preserve the cursor/checkpoint and investigate repeated snapshot resets or insufficient catch-up capacity)"

      # S3 — every retained recording deletion is first committed as a
      # durable tombstone, then retried with exponential backoff capped at
      # one hour. The retention worker samples this gauge every configured
      # sweep (15m by default). A non-empty queue for 30m therefore spans at
      # least two default observations and is operational degradation, not a
      # transient provider error.
      - alert: MindPatternAudioDeletionBacklogPersistent
        expr: |
          mindpattern_audio_deletion_backlog > 0
        for: 30m
        labels:
          severity: S3
        annotations:
          summary: "Encrypted audio deletions have remained queued for 30m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audio-deletion backlog (confirm object-store availability, preserve tombstones, and verify the queue drains)"

      # S2 — the retry delay is capped at 1h and the default sweep interval
      # is 15m. An oldest tombstone above 2h has survived a full maximum
      # backoff plus multiple sweep opportunities, so a user's deletion or
      # retention expiry is materially overdue. The independent lifecycle
      # ceiling still reconciles untracked objects; this alert covers the
      # tracked, retryable deletion queue before that last-resort ceiling.
      - alert: MindPatternAudioDeletionOldestTooOld
        expr: |
          mindpattern_audio_deletion_oldest_seconds > 2 * 60 * 60
        for: 15m
        labels:
          severity: S2
        annotations:
          summary: "Oldest encrypted-audio deletion has been pending over 2h"
          runbook: "docs/INCIDENT_RUNBOOK.md — Audio-deletion backlog (treat as a retention/deletion incident; restore the original object-store target and drain the durable queue)"

      # S3 — logical erasure is immediate, but a persistent physical-purge
      # queue means the bounded worker is not converging promptly. The gauge
      # is a deliberately capped aggregate probe, never an account label.
      - alert: MindPatternAccountDeletionBacklogPersistent
        expr: |
          mindpattern_account_deletion_pending_probe > 0
        for: 30m
        labels:
          severity: S3
        annotations:
          summary: "Account-erasure physical purge has remained queued for 30m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Account-deletion backlog (confirm bounded phase progress and object-store availability without removing durable jobs)"

      # S2 — two hours is an operational escalation boundary for a rights
      # request whose inaccessible ciphertext has not finished physical
      # purge. This measures request age, not per-account content volume.
      - alert: MindPatternAccountDeletionOldestTooOld
        expr: |
          mindpattern_account_deletion_oldest_seconds > 2 * 60 * 60
        for: 15m
        labels:
          severity: S2
        annotations:
          summary: "Oldest account-erasure physical purge has been pending over 2h"
          runbook: "docs/INCIDENT_RUNBOOK.md — Account-deletion backlog (treat as a rights-request incident and restore bounded worker progress)"

      # S2 — categories are a fixed allowlist emitted by the worker. They
      # contain no exception text, identifiers, object keys, or paths.
      - alert: MindPatternAccountDeletionFailure
        expr: |
          sum(increase(mindpattern_account_deletion_failures_total[15m])) > 0
        labels:
          severity: S2
        annotations:
          summary: "Account-erasure worker failed during the last 15m"
          runbook: "docs/INCIDENT_RUNBOOK.md — Account-deletion backlog (use the safe failure category and preserve the durable job before repair)"

  # DEFAULT-ON (2026-09-26 infra audit): the /readyz probe alert ships
  # enabled — the blackbox exporter is part of the default stack now
  # (prometheus.yml + the monitoring compose), so the default monitoring
  # deployment detects a broken DB path, not just a dead process.
  - name: mindpattern-blackbox
    rules:
      # S2 — /readyz failing means DB unreachable at the required schema
      # head; the app is fail-closed and serves nothing. Distinct from
      # MindPatternAPIDown: the API process may be perfectly alive.
      - alert: MindPatternReadyzProbeFailing
        expr: |
          probe_success{job="mindpattern-blackbox"} == 0
        for: 5m
        labels:
          severity: S2
        annotations:
          summary: "Blackbox probe of /readyz failing for 5m (DB path broken)"
          runbook: "docs/INCIDENT_RUNBOOK.md — S2: API down, step 1 (/readyz 503 -> database)"

  # --------------------------------------------------------------------
  # OPTIONAL: backup freshness via node_exporter's textfile collector.
  # The compose backup service exports NO Prometheus metrics — the honest
  # mechanism is a push-style heartbeat: deploy/monitoring/
  # backup-heartbeat.sh (usually invoked by check-backup-freshness.sh from
  # cron) writes mindpattern_backup_last_success_timestamp_seconds into the
  # textfile directory with the mtime of the newest encrypted dump.
  # Uncomment BOTH rules only if node_exporter scrapes that directory AND
  # the heartbeat cron is wired (README, "Backup freshness"). The
  # cron-only alternative needs none of this — see check-backup-freshness.sh.
  # --------------------------------------------------------------------
  # - name: mindpattern-backup-textfile
  #   rules:
  #     # S2 — recovery capability degraded. Daily dumps + slack: 26h means
  #     # the newest dump missed at least one full cycle. Keep this threshold
  #     # equal to BACKUP_MAX_AGE_HOURS in check-backup-freshness.sh.
  #     - alert: MindPatternBackupHeartbeatStale
  #       expr: |
  #         time() - mindpattern_backup_last_success_timestamp_seconds > 26 * 60 * 60
  #       for: 15m
  #       labels:
  #         severity: S2
  #       annotations:
  #         summary: "Newest encrypted backup is older than 26h"
  #         runbook: "docs/INCIDENT_RUNBOOK.md — Backups / Off-site replication (treat a stale backup as an amplifier for any live incident)"
  #
  #     # S2 — the heartbeat series is absent entirely: the cron wiring or
  #     # the textfile scrape broke (a broken freshness check must not fail
  #     # silent, which is exactly what absence detection is for).
  #     - alert: MindPatternBackupHeartbeatAbsent
  #       expr: |
  #         absent(mindpattern_backup_last_success_timestamp_seconds)
  #       for: 30m
  #       labels:
  #         severity: S2
  #       annotations:
  #         summary: "Backup heartbeat metric never appeared (wiring broken)"
  #         runbook: "docs/INCIDENT_RUNBOOK.md — Backups; deploy/monitoring/README.md, Backup freshness"

  # --------------------------------------------------------------------
