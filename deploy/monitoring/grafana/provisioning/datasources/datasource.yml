# Grafana datasource provisioning (mounted read-only by the monitoring
# docker-compose.yml). The stable `uid` is what the provisioned dashboard
# (grafana/dashboards/mindpattern-overview.json) references, so renaming
# the datasource display name never orphans the dashboard.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Service DNS on the monitoring stack's internal network.
    url: http://prometheus:9090
    uid: mindpattern-prometheus
    isDefault: true
    editable: false
