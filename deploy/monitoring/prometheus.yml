# Prometheus scrape configuration for the MindPattern API.
#
# OPERATOR TOOLING — this stack is opt-in but carries the SAME digest
# discipline as production (final verification 2026-09-22: this comment
# still described the pre-pinning state). The production docker-compose.yml
# runs @sha256-pinned release images; every image in the monitoring
# docker-compose.yml is repo:tag@sha256-pinned too, and `verify.sh
# --production` (run in CI's monitoring-verify job) fails a dropped digest
# (see deploy/monitoring/README.md, "Digest pinning").
#
# TARGET WIRING
#   `api:8000` is the compose-internal service DNS name — the same network
#   the existing backup service uses when it runs `pg_dump -h db`. This
#   requires the monitoring containers to join the production compose
#   network (see the `mindpattern` external network in the monitoring
#   docker-compose.yml; its name defaults to mindpattern_default).
#   Do NOT switch to host.docker.internal: the api publishes 8000 on
#   127.0.0.1 ONLY (loopback), so a container reaching the host's bridge
#   address would be refused.
#
# TOKEN
#   Prometheus does NOT expand environment variables inside config files —
#   a `bearer_token: ${VAR}` line would send the literal string and 401 on
#   every scrape. The credential therefore travels by FILE:
#   `bearer_token_file: /etc/prometheus/metrics-token`, mounted from
#   deploy/monitoring/token on the host (see the monitoring
#   docker-compose.yml `configs:` entry). Create that file with the SAME
#   value the api service was given (README, "Enabling /metrics" —
#   production /metrics 404s until the api has MINDPATTERN_METRICS_TOKEN)
#   before starting the stack:
#     umask 077 && printf '%s' "$MINDPATTERN_METRICS_TOKEN" > token
#   Fail-closed posture: `docker compose up` refuses to start when the
#   file is missing (compose resolves `configs: file:` eagerly), and
#   Prometheus fails to load the config when the file exists but cannot
#   be read. The file is gitignored (never commit a real token).

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: mindpattern-api
    # GET http://api:8000/metrics with `Authorization: Bearer <token>`.
    # The endpoint is the only source of the mindpattern_* series; see
    # backend/app/metrics.py for exactly what is (and deliberately not)
    # exported: aggregate counters only, never usernames, paths, or
    # per-user latencies.
    metrics_path: /metrics
    scheme: http
    # Container-absolute path, mounted from deploy/monitoring/token (0600,
    # owner-only, never committed). NOT `bearer_token:` — Prometheus does
    # not env-expand config contents.
    bearer_token_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8000"]

  # OPTIONAL synthetic probe (enable together with `--profile blackbox` in
  # the monitoring docker-compose.yml, then uncomment this job AND the
  # MindPatternReadyzProbeFailing alert in alerts.yml). Unlike the scrape
  # above — which proves the API process serves /metrics — this proves
  # /readyz returns 200, i.e. DB connectivity at the exact schema head.
  #
  # - job_name: mindpattern-blackbox
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets:
  #         - http://api:8000/readyz
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: blackbox:9115
