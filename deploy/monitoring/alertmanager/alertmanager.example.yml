# MINIMAL ALERTMANAGER EXAMPLE — 2026-09-21 audit workstream 6 follow-up;
# DEFAULT-ON since the 2026-09-26 infra audit (alerts evaluated but never
# delivered was the finding): the monitoring compose runs a digest-pinned
# alertmanager under the `monitoring` profile, and prometheus.yml points at
# it. The config travels by fail-closed file mount (`configs:` in the
# monitoring compose), so `docker compose up` REFUSES to start until
# alertmanager.yml exists:
#
#   1. Copy this file to alertmanager.yml (same directory).
#   2. Fill in the receiver(s) — where S1/S2 pages land is an operator
#      decision (PagerDuty? Slack? email? your existing pager).
#   3. `docker compose ... --profile monitoring up -d` — done.
#

# Severity routing mirrors docs/INCIDENT_RUNBOOK.md: S1/S2 page (the
# runbook's 15-minute target), S3 lands in the low-priority channel only.

global:
  # The From address for every receiver that sends email.
  smtp_from: "mindpattern-alerts@example.com"
  # smtp_smarthost: "smtp.example.com:587"
  # smtp_auth_username: "..."
  # smtp_auth_password: "..."

route:
  # Group S1s individually — a plaintext-exposure page must not wait behind
  # a batching window. Everything else batches briefly to avoid flapping.
  receiver: s1-page
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "S1"
      receiver: s1-page
      group_wait: 0s
      repeat_interval: 30m
    - matchers:
        - severity = "S2"
      receiver: s2-page
      group_wait: 30s
      repeat_interval: 2h
    - matchers:
        - severity = "S3"
      receiver: s3-quiet
      group_wait: 5m
      repeat_interval: 12h

receivers:
  - name: s1-page
    webhook_configs:
      # Your pager's webhook (PagerDuty Events API v2, Opsgenie, ...).
      - url: "http://fill-me-in.example.com/pager/s1"
        send_resolved: true
  - name: s2-page
    webhook_configs:
      - url: "http://fill-me-in.example.com/pager/s2"
        send_resolved: true
  - name: s3-quiet
    webhook_configs:
      - url: "http://fill-me-in.example.com/chat/s3"
        send_resolved: true

# A resolved S2/S3 must not re-page while its S1 is still firing.
inhibit_rules:
  - source_matchers:
      - severity = "S1"
    target_matchers:
      - severity =~ "S2|S3"
    equal: ["alertname"]
