# OPERATOR TOOLING — deliberately OUTSIDE the release-env image contract
# (deploy/README.md): the production docker-compose.yml consumes only the
# immutable @sha256 release references from the release env asset, and these
# services are opted into separately. Since 2026-09-22 (audit G-7/NEW-4)
# every image below is pinned in the same repo:tag@sha256:... form as that
# contract, resolved from the registry and held HERE rather than in a
# release asset — operator tooling must not weaken the bar, and a re-pull
# now reproduces the exact bytes forever. Upgrades are therefore DELIBERATE
# re-pins: resolve the new tag's digest (README.md here, "Digest pinning" —
# docker buildx imagetools inspect / docker manifest inspect, or the Docker
# Hub tags API), replace tag AND digest together, and run
# `bash verify.sh --production`; CI (ci.yml, monitoring-verify job) asserts
# the same contract on every push, so a dropped or stale @sha256 half fails
# the build, not the 3am deploy.
#
# Nothing here starts with a plain `up`: prometheus + grafana + alertmanager
# are gated behind the `monitoring` profile (same pattern as the `backups`
# profile in the production file), and the host-metrics node_exporter behind
# `node`. The blackbox /readyz probe is the exception — DEFAULT-ON since the
# 2026-09-26 infra audit (the default stack must see a broken DB path, so it
# carries no profile gate); its `tls` cert-expiry module remains OPT-IN (the
# matching scrape job in prometheus.yml stays commented until real public
# hostnames exist).
#
#   docker compose -f deploy/monitoring/docker-compose.yml \
#     --profile monitoring up -d

services:
  # Delivery for firing alerts (2026-09-26 infra audit: alerts evaluated
  # inside Prometheus but nothing paged anyone by default). Runs under the
  # SAME `monitoring` profile as prometheus; its RECEIVER CONFIG follows the
  # metrics-token fail-closed pattern: `configs:` resolves eagerly, so
  # `up` refuses to start until alertmanager/alertmanager.yml exists —
  # copy the committed .example next to it and fill the receiver (where
  # S1/S2 pages land is an operator decision; the example routes by the
  # INCIDENT_RUNBOOK severities).
  alertmanager:
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["monitoring"]
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
        mode: 0444
    volumes:
      - alertmanager_data:/alertmanager
    networks: [internal]
    restart: unless-stopped
    mem_limit: 192M
    cpus: 0.5
    pids_limit: 128
    # 2026-09-28 audit: readiness surfaces in `docker compose ps` (HEALTHY)
    # instead of a silently wedged process with restart: unless-stopped
    # masking it. /-/ready is alertmanager's own readiness endpoint (it
    # answers 200 only once the config loaded and the UI is servable);
    # wget is the busybox binary the image ships.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # UI intentionally not published (same rule as prometheus): SSH tunnel
    # or a temporary loopback publish to inspect silences at 127.0.0.1:9093.

  prometheus:
    # Pinned 2026-09-22 (audit G-7/NEW-4): repo:tag@sha256 — v3.x line.
    # Re-pin deliberately (README.md here, "Digest pinning"); verify.sh
    # --production (and CI's monitoring-verify job) fail a dropped digest.
    image: prom/prometheus:v3.4.1@sha256:9abc6cf6aea7710d163dbb28d8eeb7dc5baef01e38fa4cd146a406dd9f07f70d
    # G-4 (2026-09-21 audit): the production hardening quartet,
    # applied to the operator tooling too — these containers join
    # the production network and read its metrics.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Aggregate counters are cheap; 30d comfortably spans the incident
      # postmortem window (runbook: 5 business days) plus trend context.
      - --storage.tsdb.retention.time=30d
    # The scrape credential travels by FILE, not env: Prometheus does NOT
    # expand variables inside prometheus.yml, so an env var could never
    # reach `bearer_token:` (prometheus.yml reads it via
    # bearer_token_file: /etc/prometheus/metrics-token). Compose resolves
    # `configs: file: ./token` eagerly — `up` fails closed when the token
    # file has not been created (see README.md here, "Token wiring").
    configs:
      - source: metrics_token
        target: /etc/prometheus/metrics-token
        # Read-only content mount; the HOST file must stay 0600/owner-only.
        mode: 0444
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [mindpattern, internal]
    restart: unless-stopped
    mem_limit: 768M
    cpus: 0.5
    # Fork-bomb / leak containment (same posture as the production file's
    # services): a metrics TSDB must not be able to exhaust host PIDs.
    # Single top-level limit form only (re-audit 2026-09-27: the duplicate
    # deploy.resources block was removed — same rule as the production file).
    pids_limit: 256
    # 2026-09-28 audit: /-/healthy is Prometheus's own liveness endpoint —
    # TSDB corruption and config-reload wedges answer 500 there while the
    # process still runs (restart: unless-stopped would otherwise hide it
    # only until the process itself dies, which may be never).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # The Prometheus UI is intentionally NOT published. To look at it, use
    # an SSH tunnel to the host and a temporary loopback publish, e.g.
    #   ports: ["127.0.0.1:9090:9090"]
    # (loopback only — same rule as the api service in the production file).

  grafana:
    # Pinned 2026-09-22 (audit G-7/NEW-4): repo:tag@sha256. Re-pin
    # deliberately (README.md here, "Digest pinning"); verify.sh
    # --production (and CI's monitoring-verify job) fail a dropped digest.
    image: grafana/grafana:12.0.0@sha256:263cbefd5d9b179893c47c415daab4da5c1f3d6770154741eca4f45c81119884
    # G-4 (2026-09-21 audit): the production hardening quartet,
    # applied to the operator tooling too — these containers join
    # the production network and read its metrics.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Final verification 2026-09-22: /var/lib/grafana was ALSO listed here
      # while the named volume below mounts the same destination — one mount
      # shadows the other, and the tmpfs winning would silently discard
      # grafana.db on every recreate. The named volume owns /var/lib/grafana
      # (persistence); the tmpfs covers scratch only.
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Fail closed like the rest of the stack: Grafana defaults to
      # admin/admin, which must never reach a listening socket.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD (openssl rand -base64 24) in the owner-only secrets file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Dashboards as code (2026-09-21 audit workstream 6 follow-up): the
      # datasource AND a dashboard provider are provisioned read-only, and
      # the panels live in ./grafana/dashboards — verify.sh grounds every
      # panel expression against backend/app/metrics.py, exactly like
      # alerts.yml, so the dashboard cannot drift from the exposition.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/opt/mindpattern-dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Loopback only, like the api service: reach it via SSH tunnel or your
      # own TLS-terminating proxy. Never expose Grafana to a network as-is.
      - "127.0.0.1:3000:3000"
    networks: [internal]
    restart: unless-stopped
    mem_limit: 512M
    cpus: 0.5
    pids_limit: 256
    # 2026-09-28 audit: /api/health is Grafana's documented health endpoint
    # (no auth required, answers {"database":"ok"}). wget, not curl — the
    # Ubuntu-based image ships no curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  blackbox:
    # Uptime probe of /readyz (default-on — see the profile note below) AND
    # the opt-in TLS cert-expiry probe (the `tls` module; enable its scrape
    # job in prometheus.yml together with real public hostnames).
    # Pinned 2026-09-22 (audit G-7/NEW-4): repo:tag@sha256. Re-pin
    # deliberately (README.md here, "Digest pinning"); verify.sh
    # --production (and CI's monitoring-verify job) fail a dropped digest.
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    # G-4 (2026-09-21 audit): the production hardening quartet,
    # applied to the operator tooling too — these containers join
    # the production network and read its metrics.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # The stock image config has no generic TLS-connect module, so the
    # module set ships as code: http_2xx (byte-equivalent to stock, used
    # by the /readyz probe job) + tls (cert-expiry probe job — see
    # blackbox-modules.yml for why it skips chain verification). Mounted
    # over the path the image's own --config.file flag already points at.
    volumes:
      - ./blackbox-modules.yml:/etc/blackbox_exporter/config.yml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # DEFAULT-ON (2026-09-26 infra audit): the /readyz probe needs no
    # external targets and no host decisions, so it joins the default
    # `monitoring` profile — the default stack must see a broken DB path.
    # (The TLS module/job stays opt-in: it needs real public hostnames.)
    networks: [mindpattern]
    restart: unless-stopped
    mem_limit: 96M
    cpus: 0.5
    pids_limit: 256
    # 2026-09-28 audit: the exporter's own landing page on :9111 — if the
    # probe process itself is wedged, Prometheus's probe_success failures
    # should read alongside a red `docker compose ps`, not instead of it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9111/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  node-exporter:
    # OPTIONAL host-level metrics (disk, the one failure class the API's
    # own exposition cannot see). Enable together with the
    # mindpattern-node scrape job in prometheus.yml and the
    # mindpattern-host alert group in alerts.yml:
    #   --profile monitoring --profile node up -d
    # Pinned 2026-09-26 (resolved from the Docker Hub registry API, the
    # same flow as README.md here, "Digest pinning"): repo:tag@sha256,
    # v1.9.x multi-arch manifest list.
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    # G-4 (2026-09-21 audit) quartet, like its siblings. The HOST root
    # filesystem is mounted read-only at /host and the path flags below
    # point every collector at it — inside the container the exporter sees
    # the host's real filesystems (pgdata/pgbackups volumes, log dirs),
    # which is the entire point. It publishes nothing and joins only the
    # internal network: prometheus scrapes it at node-exporter:9100.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      # rslave so mount events under / (container runtime volumes) are
      # visible — stale mount data would make the disk alerts lie.
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["node"]
    networks: [internal]
    restart: unless-stopped
    mem_limit: 96M
    cpus: 0.5
    pids_limit: 256
    # 2026-09-28 audit: /metrics on :9100 (the port Prometheus scrapes) —
    # a wedged exporter otherwise shows up only as a scrape gap.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # The production stack's default compose network, joined as external so
  # prometheus/blackbox can reach the api by service DNS (api:8000) — the
  # same mechanism the backup service uses for `pg_dump -h db`.
  # For the deploy/README.md flow (APP_DIR=/srv/mindpattern) the project is
  # `mindpattern`, so the network is mindpattern_default; a checkout-run
  # dev stack uses mental_health_application_default. Confirm with
  # `docker network ls` and export MINDPATTERN_COMPOSE_NETWORK if yours
  # differs (e.g. a custom `compose -p <project>`).
  mindpattern:
    name: ${MINDPATTERN_COMPOSE_NETWORK:-mindpattern_default}
    external: true
  # Grafana must not sit on the production network; it only talks to
  # prometheus over this one.
  internal: {}

# The /metrics bearer token, mounted at /etc/prometheus/metrics-token for
# prometheus.yml's bearer_token_file. NOT committed: create it by hand from
# the same value the api service uses (README.md here, "Token wiring"):
#   umask 077 && printf '%s' "$MINDPATTERN_METRICS_TOKEN" > token
# A missing file fails `docker compose up` eagerly (fail closed).
configs:
  metrics_token:
    file: ./token
  # Fail-closed receiver config (see the alertmanager service comment):
  # copy alertmanager/alertmanager.example.yml to alertmanager.yml and fill
  # the receiver — a missing file refuses `up`, so delivery can never be
  # silently absent.
  alertmanager_config:
    file: ./alertmanager/alertmanager.yml

volumes:
  prometheus_data: {}
  grafana_data: {}
  alertmanager_data: {}
