# Pre-commit hooks for the backend tree. Install once: `pre-commit install`.
# The ruff version here (v0.16.6) is the same one CI pins and the config in
# backend/pyproject.toml was verified against.
#
# The backend is format-clean under the same Ruff version CI enforces.
#
# revs are pinned to each tag's commit SHA (resolved via git ls-remote),
# matching the SHA-pinning posture used for CI actions: a moved tag must
# never silently repoint developer-machine hooks.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b # v0.16.6
    hooks:
      # Scoped to backend/ (2026-09-19 audit, L-84): CI lints only
      # backend/, and the unscoped hook fired on every other Python file in
      # the tree (backup/backup_mac.py, redteam/ — 200+ findings under a
      # config those files were never written against). Scope here must
      # match CI's, or hooks and CI disagree about what "clean" means.
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^backend/
      - id: trailing-whitespace
        files: ^backend/
