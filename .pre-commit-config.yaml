# Hook versions match CI; commit-SHA pins prevent mutable tags from changing tools.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b # v0.16.6
    hooks:
      # Keep lint and format scope aligned with the backend CI job.
      - id: ruff
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^backend/
      - id: trailing-whitespace
        files: ^backend/
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      # Apply the repository secret policy to staged changes in every directory.
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 4de1378e4cd853bfc2b111b05fff35e2dbf809a3 # v0.9.0.6
    hooks:
      # Match CI severity: parse and quoting failures block commits.
      - id: shellcheck
        name: shellcheck (deploy/)
        files: ^deploy/.*\.sh$
        args: [--severity=error]
