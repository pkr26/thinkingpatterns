# Secret-scanning policy (audit F-4, 2026-09-26).
#
# CI (`.github/workflows/ci.yml`, `secrets` job) runs gitleaks — pinned by
# version AND sha256 like every other external tool in this pipeline — over
# the full git history and the working tree. Default rules are extended,
# not replaced.
#
# Allowlist policy — every entry needs a written defense, and adding one
# is a reviewable decision:
#   - shared/(vectors|interop_fixtures).json — the published cross-platform
#     crypto test vectors. Every "key" in them is a fixture by design and
#     is pinned byte-for-byte by the backend/mobile/portal/web suites.
#   - tests?/ directories — throwaway credentials and crypto fixtures in
#     test code. Policy: a real production secret must never live in a
#     test; if one ever does, ROTATE it — an allowlist entry is not secrecy.
#     Pentest 2026-09-29 INFRA-3: the path alone exempted ANY value in any
#     tests dir; the entry now ALSO requires the flagged value to look like
#     a fixture (see the allowlist body for the marker vocabulary and the
#     condition=and semantics).
#   - generated/vendored trees — node_modules, coverage, dist, .venv,
#     .tools, redteam mutation-campaign results: machine-generated
#     copies of already-scanned source, or vendored toolchains.
#     reports/ holds TRACKED hand-written simulation source and reports
#     (simulate.py, probe_tune.py, SIMULATION_REPORT.md) — only its
#     generated artifacts (results JSON / run logs) are exempted
#     (audit 2026-09-26: the former whole-tree entry silently exempted
#     the hand-written source from every scan; the tracked files were
#     re-verified clean when this was narrowed).
#   - `wrapKeyBlobB64` — a TypeScript parameter name in portal/src/api.ts
#     (the wrap-key ciphertext blob); the generic entropy rule reads the
#     identifier itself as the "secret" beside `wrap_key_blob:`.

[extend]
useDefault = true

[[allowlists]]
# The deterministic audio encryption key is a published interoperability
# fixture used by backend/mobile/web/portal tests. Exempt only that exact
# value in its exact fixture file. Historical versions use the same value.
# The authoritative full-history scan enforces both conditions; the pinned
# no-git scanner has the path-condition limitation documented below.
description = "exact published audio interoperability fixture key"
condition = "and"
paths = ['''(^|[/\\])shared/audio_vectors\.json$''']
regexTarget = "secret"
regexes = ['''^ESIzRFVmd4iZqrvM3e7/ECEyQ1RldoeYqbrL3O3\+DyA=$''']

[[allowlists]]
description = "published crypto test vectors (cross-platform pins)"
paths = [
  '''shared/(vectors|interop_fixtures)\.json''',
]

[[allowlists]]
# Pentest 2026-09-29 INFRA-3: this was a bare path exemption — ANY secret
# pasted into any directory named tests/ or test/ was invisible to both CI
# and pre-commit. The path component stays, but the exemption now also
# requires the flagged VALUE to look like a fixture: `condition = "and"` +
# `regexTarget = "secret"` mean a finding under a tests path is allowed only
# when the secret itself matches a clearly-fake marker. Realistic shapes
# (AKIA…, ghp_…, a random sk-… key, a private-key block) committed into
# test code now fail the gate like anywhere else — verified against
# gitleaks v8.30.1, the version ci.yml and pre-commit both pin (note the
# key is `condition`, not `matchCondition`, at this version; a future pin
# bump that drops the key would flag the fixtures and fail loudly, not
# silently re-widen the exemption). Engine caveat, verified on the pinned
# binary: the full-HISTORY scan — CI's authoritative gate, and the one
# that sees every tests/ file, since CI checks out committed content only —
# enforces the AND (a planted AKIA…/ghp_… value under backend/tests/ is
# caught). The --no-git scanner (and pre-commit's staged pass) skips whole
# files on a bare paths match in sources/common.go shouldSkipPath without
# consulting the condition — a v8.30.1 limitation upstream marks
# "TODO: Remove this in v9"; re-test both modes when the pin next moves.
#
# Marker vocabulary, kept honest and minimal: the classic placeholder words
# plus the exact synthetic values this repo's fixtures actually use today —
# sequential hex runs (0123456789, abcdef, e.g. `abcdEFGH1234` and the
# `sk-live-abcdef0123456789` fake LLM key), the alternating
# `a1b2c3d4e5f6…` wrap-key-fingerprint placeholder, and the
# `rotation-with-rewrap-*` password fixtures. Base32 TOTP secrets are
# deliberately NOT matched: synthetic and real base32 are indistinguishable
# by shape, so an enrollment secret in a test must stay a FINDING.
description = "test fixtures and throwaway test credentials (tests path + clearly-fake value)"
paths = [
  '''(^|[/\\])tests?([/\\]|$)''',
]
regexTarget = "secret"
regexes = [
  '''(?i)(fake|dummy|example|redteam|audit-|gui-|e2e-|test|xxxx|aaaa|abcdef|0123456789|a1b2c3d4e5f6|rotation-with-rewrap)''',
]
condition = "and"

[[allowlists]]
description = "generated and vendored trees"
paths = [
  '''(^|[/\\])node_modules([/\\]|$)''',
  '''(^|[/\\])coverage([/\\]|$)''',
  '''(^|[/\\])\.venv([/\\]|$)''',
  '''(^|[/\\])\.tools([/\\]|$)''',
  '''(^|[/\\])dist([/\\]|$)''',
  # reports/: generated artifacts ONLY — the directory's tracked .py/.md
  # files are hand-written source and stay scanned (audit 2026-09-26).
  '''reports/[^/]+/(results\.json|sim_run\.log|run\.log)$''',
  # Stryker's machine-generated mutation report. The mobile/portal/web
  # report trees are gitignored; this covers its HISTORY copies (the old
  # whole-tree reports rule exempted them). The generic entropy rule
  # reads an embedded `therapistPubSpkiB64.length === <num>` assertion as
  # a key — a copy of already-scanned test source, not a secret.
  '''reports/mutation/mutation\.json$''',
  '''redteam/mutation_campaign_[^/]+/results/''',
]

[[allowlists]]
description = "ciphertext property names adjacent to variable references"
regexes = [
  '''wrapKeyBlobB64''',
]

[[allowlists]]
# Two exact public strings trip the default generic-api-key heuristic:
# "therapist" contains "api" immediately before the documented processing
# label, and React-cxxstableapi is followed by CocoaPods' public spec checksum.
# Do not add `paths` here: pinned gitleaks 8.30.1 skips a whole file on a
# no-git path allowlist before evaluating its condition. Exact full matches
# keep every other value in both files visible to the working-tree scanner;
# a dependency bump must review and update the public checksum deliberately.
description = "exact documentation phrase and public CocoaPods spec checksum"
regexTarget = "match"
regexes = [
  '''therapist linkage, speech/translation''',
  '''React-cxxstableapi: 1e0ad8a5ecb7f2f5440c012798cf20bec6341c1f''',
]

[[allowlists]]
description = "React Native Xcode environment shim (pentest S-14, 2026-09-26)"
paths = [
  '''mobile/ios/\.xcode\.env$''',
]
# Defense: the RN template COMMITS this file — the Xcode build phase sources
# it for NODE_BINARY, so untracking it would break fresh clones. Its whole
# content is `export NODE_BINARY=$(command -v node)` (verified 2026-09-26):
# no secret, no machine-specific value. The redteam G3 probe and gitleaks
# flag the FILENAME pattern (.env), not any finding inside it.

[[allowlists]]
# OPS-04: this exact historical public value hashes the app.api.therapist
# constant table in MODULE_CONSTANTS_DIGESTS; it is not an authentication key.
# Match the full public assignment, never a test-directory path or arbitrary
# digest shape: pinned v8.30.1 path shortcuts would hide adjacent secrets in
# no-git/staged scans. A changed digest needs separate review, not this rule.
description = "exact public therapist-module constant-table digest assignment"
regexTarget = "match"
regexes = ['''^app\.api\.therapist": "a3b747d3c02e9468"$''']

[[allowlists]]
