# not credentials for any deployed account. crypto_vectors_small.json comes
# from scripts.generate_vectors CASES/ENCRYPT_CASES/ENVELOPE_* inputs with
# the oracle's PBKDF2 iteration count 2; the envelope data key is the literal
# byte range 200..231 also published in shared/vectors.json. runtime_outputs
# records automatic_backend_script_oracles.load_cli_case/seed_cli_case with
# synthetic-password, deterministic mindpattern-loadtest:<username> or
# mindpattern-seed-demo:demo SHA-256 salts and PBKDF2 iteration count 1000.
# The CLI clients are offline stubs; no enrollment or live service is used.
# Match each entire assignment exactly. Never add fixture paths or a general
# key shape: v8.30.1 staged/no-git path shortcuts would conceal other secrets.
# test_repo_secret_scan restricts every value (including its escaped regex
# spelling) to its reviewed fixture, this policy and that guard; only the
# published envelope byte-range value additionally appears in shared/vectors.
description = "exact deterministic offline crypto and CLI vector assignments"
regexTarget = "match"
