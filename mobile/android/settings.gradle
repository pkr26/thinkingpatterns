pluginManagement {
  includeBuild("../node_modules/@react-native/gradle-plugin")
  // Expo autolinking (expo@57): the settings plugin that defines
  // expoAutolinking/useExpoModules. Resolved through expo's own package
  // (hoisting-safe, never a hardcoded node_modules path). expo@57 ships the
  // plugin in expo-modules-autolinking/android/expo-gradle-plugin; the
  // legacy `apply from: .../expo/scripts/autolinking.gradle` stanza cannot
  // resolve — that file no longer exists in this SDK.
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins { id("com.facebook.react.settings"); id("expo-autolinking-settings") }
// node_modules/expo/react-native.config.js enables the expo platform ONLY
// while this file matches /useExpoModules/ — the call below is the gate.
// Routing the RN config command through expoAutolinking makes community
// autolinking see the same module list useExpoModules() pods in.
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand) }
expoAutolinking.useExpoModules()
rootProject.name = 'MindPattern'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
