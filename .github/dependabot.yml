# Dependabot: weekly bumps for every ecosystem this repo pins.
# Runtime and CI Python closures are hash-pinned in backend/requirements*.lock.txt
# and are load-bearing (the suite verifies against those exact sets) — review
# pip PRs against a full local test run, not just CI green.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # requirements.in / requirements.dev.in are the reviewable sources;
    # regenerate both hash locks after accepting a Dependabot update.
    groups:
      python-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      npm-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: weekly
    groups:
      npm-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Backend Dockerfile base image (digest-pinned python:3.14-slim).
  # Note: dependabot has no docker-compose ecosystem; the postgres digest in
  # docker-compose.yml is bumped manually (comment there explains how).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
