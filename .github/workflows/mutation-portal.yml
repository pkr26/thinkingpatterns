name: Portal mutation gate

# H-5 (2026-09-21 audit): portal mutation coverage was structurally
# invisible — no workflow ever ran Stryker here, and stryker.config.json
# carried thresholds.break: 0 (any score passes). This weekly scheduled
# run makes the campaign real and keeps the number honest.
#
# WIRING FIXED 2026-09-22 (final-verification remediation): the
# @stryker-mutator/vitest-runner 10 + vitest 5 combination silently ran
# ZERO tests per mutant (mutants all "survived"; first baseline 1.26%).
# Re-verified locally: even a body-emptied buildAad survived. The runner
# is now Stryker's COMMAND runner — a fresh `vitest run` process per
# mutant, no shared module graph to go stale (validated scoped: aad.ts
# 0% → 100%). Mutate scope is the security/contract-critical modules
# (crypto.ts, aad.ts, api.ts, platform.ts), mirroring the mobile
# per-file-floor philosophy; full-suite-per-mutant at concurrency 1
# keeps the inPlace file rewriting safe (~20-25 min).
#
# MEASURED BASELINE (2026-09-22, this repository): aggregate 74.10% —
# 652 killed / 3 timeout / 229 survived (aad 100.00, crypto 81.18,
# api 74.16, platform 53.27). The floor sits at 70.0: below the measured
# value only by a small churn margin — raise it when the score rises,
# never lower it.

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC (after the mobile gate)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Only the root .nvmrc exists; portal has no per-package pin.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install dependencies
        working-directory: portal
        run: npm ci
      - name: Run Stryker
        working-directory: portal
        # A runner/configuration failure is not a score. Let it fail the
        # workflow; the report upload below still runs for diagnosis.
        run: npx stryker run
      - name: Enforce the floor (70.0 — measured baseline 74.10, 2026-09-22; see header)
        working-directory: portal
        run: |
          SCORE=$(node -e "
            try {
              const r = JSON.parse(require('fs').readFileSync('reports/mutation/mutation.json', 'utf8'));
              let s = typeof r.score === 'number' ? r.score : (r.totals?.score ?? null);
              if (s === null && r.files) {
                let killed = 0, covered = 0;
                for (const mutants of Object.values(r.files)) {
                  for (const m of mutants.mutants) {
                    if (m.status === 'Killed' || m.status === 'Timeout') { killed++; covered++; }
                    else if (m.status === 'Survived' || m.status === 'NoCoverage') covered++;
                  }
                }
                if (!covered) { console.error('empty report'); process.exit(2); }
                s = (killed / covered) * 100;
              }
              if (s === null) { console.error('no score in report'); process.exit(2); }
              console.log(s);
            } catch (e) { console.error(e.message); process.exit(2); }
          ")
          echo "mutation score: $SCORE"
          awk -v s="$SCORE" 'BEGIN { exit !(s < 70.0) }' && {
            echo "::error::portal mutation score $SCORE is below the 70.0 floor (measured baseline 74.10 on 2026-09-22) — mutants survived that the suite used to kill"
            exit 1
          }
      - name: Upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: portal-stryker-report
          path: portal/reports/mutation/
          retention-days: 30
