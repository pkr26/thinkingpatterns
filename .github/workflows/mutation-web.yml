name: Web mutation gate

# H-5 (2026-09-21 audit): web mutation coverage was structurally
# invisible — no workflow ever ran Stryker here, and stryker.config.json
# carried thresholds.break: 0 (any score passes). This weekly scheduled
# run makes the campaign real and keeps the number honest.
#
# WIRING FIXED 2026-09-22 (final-verification remediation): the
# @stryker-mutator/vitest-runner 10 + vitest 5 combination silently ran
# ZERO tests per mutant (mutants all "survived"; first baseline 1.26%).
# The runner is Stryker's COMMAND runner — a fresh `vitest run` process per
# mutant, no shared module graph to go stale (validated scoped: aad.ts
# 0% → 100%).
#
# FRONTEND CAMPAIGN 2026-09-22 (mutation_campaign_2026-09-22_frontend):
# the mutate scope widened from the four contract modules to ALL of src —
# the views (where four audit-remediation waves landed) had never been
# measured with the working runner. Fresh full-src baseline 3,549 mutants /
# 55.68%; the campaign's two pin rounds (tests/
# mutation_2026_09_22_frontend*.pins.test.tsx + _round2) lifted it to 65.65%
# with 348 mutant-by-mutant verified kills. The
# remaining gap is documented in the campaign REPORT.md: style/theme
# literals, environment-limited equivalents, and view copy fragments.
# concurrency 2 is safe here: Stryker 10 selects the active mutant via the
# __STRYKER_ACTIVE_MUTANT__ env var, so parallel vitest processes mutate
# independently. The 45 s mutant budget (suite baseline ~1.4 s) bounds the
# infinite-loop mutants the views produce — each used to burn 120 s.
# The floor sits at 65.0: below the measured 65.65 only by a small churn
# margin — raise it when the score rises, never lower it.

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC (after the mobile gate)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    # Full-src scope (2026-09-22): 3,549 mutants at concurrency 2 measured
    # ~45-100 min depending on machine; the previous 90 was the 4-file scope.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Only the root .nvmrc exists; web has no per-package pin.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run Stryker
        working-directory: web
        # A runner/configuration failure is not a score. Let it fail the
        # workflow; the report upload below still runs for diagnosis.
        run: npx stryker run
      - name: Enforce the floor (65.0 — measured 65.65 on 2026-09-22 over ALL of src after the campaign's two pin rounds; see header)
        working-directory: web
        run: |
          SCORE=$(node -e "
            try {
              const r = JSON.parse(require('fs').readFileSync('reports/mutation/mutation.json', 'utf8'));
              let s = typeof r.score === 'number' ? r.score : (r.totals?.score ?? null);
              if (s === null && r.files) {
                let killed = 0, covered = 0;
                for (const mutants of Object.values(r.files)) {
                  for (const m of mutants.mutants) {
                    if (m.status === 'Killed' || m.status === 'Timeout') { killed++; covered++; }
                    else if (m.status === 'Survived' || m.status === 'NoCoverage') covered++;
                  }
                }
                if (!covered) { console.error('empty report'); process.exit(2); }
                s = (killed / covered) * 100;
              }
              if (s === null) { console.error('no score in report'); process.exit(2); }
              console.log(s);
            } catch (e) { console.error(e.message); process.exit(2); }
          ")
          echo "mutation score: $SCORE"
          awk -v s="$SCORE" 'BEGIN { exit !(s < 65.0) }' && {
            echo "::error::web mutation score $SCORE is below the 65.0 floor (measured 65.65 on 2026-09-22, full-src scope after the campaign's two pin rounds) — mutants survived that the suite used to kill"
            exit 1
          }
      - name: Upload the report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: web-stryker-report
          path: web/reports/mutation/
          retention-days: 30
