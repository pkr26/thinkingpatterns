name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # One active run per ref; a new push cancels the now-stale one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          # The complete test/lint closure is resolved once, pinned, and
          # hash-checked.  Never let a PR resolve a new transitive package.
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Backend tests with coverage
        working-directory: backend
        # --cov-fail-under pins the floor at the suite's measured total
        # (97% at the time this gate was added); lower it only deliberately.
        run: python -m pytest tests/ --cov=app --cov-report=term --cov-fail-under=97

  backend-postgres:
    # The same suite against real Postgres. conftest.py reads
    # MINDPATTERN_TEST_DB_URL (default stays in-memory SQLite). This job
    # exists because SQLite and Postgres differ on constraint, locking, and
    # type behavior, and Postgres is what docker-compose deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same tag family as docker-compose.yml's db service (digest-pinned
        # there). This is a throwaway service container, so the password is
        # a non-secret CI string, not an operator credential.
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: mindpattern_test
        ports:
          # Loopback-only: a bare 5432:5432 would publish the throwaway
          # database on the runner's public interface too.
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MINDPATTERN_TEST_DB_URL: postgresql+asyncpg://postgres:ci-postgres-password@localhost:5432/mindpattern_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Full suite against Postgres
        working-directory: backend
        # No --cov-fail-under here: coverage is gated in the `backend` job;
        # this job's signal is "the suite passes under Postgres semantics".
        run: python -m pytest tests/

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests (global coverage thresholds enforced)
        working-directory: mobile
        run: npm test
      - name: Mobile dependency audit
        working-directory: mobile
        run: npm audit --audit-level=moderate

  native-release-preflight:
    # mobile/tools/verify_native_release.mjs is the fail-closed gate for the
    # committed native projects (audit E-1, 2026-09-21: ios/ and android/
    # now ship in-tree with the hardening surface — Health usage strings,
    # allowBackup=false, FLAG_SECURE, keychain autolinking). The check ran
    # nowhere before, so the exact "cannot build or install today" decay
    # mode was invisible. It must run on every push: regenerating the
    # projects or touching package.json deps can silently drop a hardening
    # property the preflight exists to police.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies (autolinking inspection needs the CLI)
        working-directory: mobile
        run: npm ci
      - name: Native release preflight
        working-directory: mobile
        run: npm run verify:native-release

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install dependencies
        working-directory: portal
        run: npm ci
      - name: Typecheck
        working-directory: portal
        run: npx tsc --noEmit
      - name: Portal tests (cross-platform vectors + coverage thresholds)
        working-directory: portal
        run: npm test
      - name: Production build
        working-directory: portal
        run: npm run build
      - name: Portal dependency audit
        working-directory: portal
        run: npm audit --audit-level=moderate

  web:
    # Patient web client (WEB_PLAN.md) — same gate shape as the portal:
    # typecheck, tests (security-config pins, platform seam, XSS floor),
    # production build, and a hard dependency audit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Web tests (security-config pins + coverage thresholds)
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Web dependency audit
        working-directory: web
        run: npm audit --audit-level=moderate

  web-contract-vectors:
    # WEB_PLAN P9.2 (four-way verification): the web client's crypto/brain
    # suites ARE the fourth leg of the cross-platform vector check —
    # backend (pytest), mobile (vitest), portal (vitest), web (vitest) all
    # pass the SAME shared/vectors.json + brain_vectors.json +
    # interop_fixtures.json. Kept as its own job so a web crypto drift is
    # visible as exactly that, not a generic test failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Cross-platform vectors (crypto + brain + interop fixtures)
        working-directory: web
        run: npx vitest run tests/crypto.test.ts tests/crypto.pins.test.ts tests/brainVectors.test.ts tests/interop.test.ts tests/contractPins.test.ts

  contract-gates:
    # The repo's two standalone proof tools, wired as gates (they were built
    # for this and previously ran only by hand):
    # - backend/probe_brain.py: planted-pattern corpus the brain must get
    #   right (9/9, zero false associations); exits non-zero on any FAIL.
    # - mobile/tools/verify_vectors.mjs: cross-platform crypto vectors run
    #   over the REAL compiled TS modules — npm ci is required so
    #   node_modules/.bin/tsc exists; without it the tool falls back to a
    #   weaker webcrypto reference check that cannot see app-code bugs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Backend deps for the probe
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Mobile deps for the real-module vector check
        working-directory: mobile
        run: npm ci
      - name: Ground-truth brain probe (9/9 required)
        working-directory: backend
        run: python probe_brain.py
      - name: Cross-platform crypto vectors
        working-directory: mobile
        run: node tools/verify_vectors.mjs

  docker:
    # Verifies deployable artifacts end to end: both images build, the
    # compose stack boots, migrations land, health probes answer, and an
    # encrypted/authenticated backup can really be restored.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a throwaway .env
        # Random per run; nothing here survives `compose down -v` below.
        run: |
          {
            echo "MINDPATTERN_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "BACKUP_KEY=$(openssl rand -base64 32)"
            # The checked-in production compose file consumes published
            # image references only.  CI intentionally opts into the
            # explicit local source-build overlay.
            echo "MINDPATTERN_API_IMAGE=mindpattern-api:ci"
            echo "MINDPATTERN_BACKUP_IMAGE=mindpattern-backup:ci"
          } > .env
      - name: Validate compose and build both local source images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build
      - name: Trivy vulnerability scan of both built images (2026-09-21 audit G-6)
        # OS-package coverage pip-audit/npm cannot see (the backend image
        # compiles asyncpg against live apt). Fixable HIGH/CRITICAL
        # findings fail the job. The scanner itself is digest-pinned
        # (final verification 2026-09-22) to match the repo's no-mutable-ref
        # policy; re-pin deliberately, like the deploy images.
        run: |
          set -euo pipefail
          for image in mindpattern-api:ci mindpattern-backup:ci; do
            echo "trivy: scanning $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.61.0@sha256:6967db29ce5294d054121e94b3cb1262de858af63b4547bb1bade66a4306f2e4 image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress "$image"
          done
      - name: Start the stack
        # --wait blocks until every service's healthcheck passes (the api
        # healthcheck is the same urllib probe the Dockerfile ships).
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
      - name: Assert health endpoints
        # /healthz is the liveness probe; /readyz proves the DB is usable
        # (SELECT 1). The retry loop covers healthcheck-flap races --wait
        # cannot see.
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error \
            http://127.0.0.1:8000/healthz
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error \
            http://127.0.0.1:8000/readyz
      - name: Assert migrations are at head
        # The entrypoint ran `alembic upgrade head` before uvicorn; verify
        # the result instead of trusting the boot log.
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T api alembic current | grep -q "(head)"
      - name: Seed a row that a backup restore must reproduce
        # Archive parsing alone cannot prove pg_restore can apply schema/data.
        # Seed through the public API so the backup assertion includes a real
        # migrated application row, not only empty tables.
        run: |
          curl --fail --silent --show-error --output /dev/null \
            -H 'Content-Type: application/json' \
            --data '{"username":"backup-restore-probe","salt":"AAAAAAAAAAAAAAAAAAAAAA==","verifier":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}' \
            http://127.0.0.1:8000/api/v1/auth/register
      - name: Create, authenticate, and actually restore a backup
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups up -d backup
          found=0
          attempt=1
          while [ "$attempt" -le 20 ]; do
            if docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups exec -T backup sh -ceu '
              set -- /backups/mindpattern-*.dump.enc
              test -f "$1"
              test -f "$1.hmac"
            '; then
              found=1
              break
            fi
            sleep 3
            attempt=$((attempt + 1))
          done
          test "$found" = 1
          restore_name="mindpattern-restore-${GITHUB_RUN_ID:-local}-${RANDOM}"
          docker run --rm -d --name "$restore_name" -e POSTGRES_PASSWORD=restore \
            postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 >/dev/null
          cleanup_restore() { docker rm -f "$restore_name" >/dev/null 2>&1 || true; }
          trap cleanup_restore EXIT
          for attempt in $(seq 1 20); do
            docker exec "$restore_name" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$restore_name" pg_isready -U postgres >/dev/null
          # HMAC verification MUST precede decryption. pipefail ensures a
          # failed verifier/decryptor cannot be masked by pg_restore.
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups exec -T backup sh -ceu '
            set -- /backups/mindpattern-*.dump.enc
            mindpattern-backup-mac verify "$1"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_KEY -in "$1"
          ' | docker exec -i "$restore_name" pg_restore --no-owner -U postgres -d postgres
          docker exec "$restore_name" psql -U postgres -d postgres -tAc \
            "SELECT count(*) FROM users WHERE username = 'backup-restore-probe'" | grep -qx '1'
          docker exec "$restore_name" psql -U postgres -d postgres -tAc \
            "SELECT to_regclass('public.alembic_version')" | grep -qx 'alembic_version'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups down -v

  release-env-contract:
    # Exercises deploy/verify-release-env.sh on every push: the script is
    # the digest-pinning enforcement point for releases and the documented
    # operator flow, and it once shipped non-executable (mode 644) without
    # any CI path noticing. Both halves are pinned: it must execute as
    # committed (proving the +x bit), accept a valid digest-pinned env,
    # and reject every invalid shape.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the committed script is executable
        run: |
          test -x deploy/verify-release-env.sh
      - name: Accepts a valid digest-pinned environment
        run: |
          printf 'MINDPATTERN_API_IMAGE=ghcr.io/example/mindpattern-api@sha256:%s\nMINDPATTERN_BACKUP_IMAGE=ghcr.io/example/mindpattern-backup@sha256:%s\n' \
            "$(printf 'a%.0s' {1..64})" "$(printf 'b%.0s' {1..64})" > /tmp/valid.env
          deploy/verify-release-env.sh /tmp/valid.env
      - name: Rejects every invalid shape
        run: |
          reject() {
            printf '%s\n' "$2" > "/tmp/bad-$1.env"
            if deploy/verify-release-env.sh "/tmp/bad-$1.env" >/dev/null 2>&1; then
              echo "::error::verify-release-env.sh accepted invalid case: $1"
              exit 1
            fi
          }
          reject floating-tag 'MINDPATTERN_API_IMAGE=ghcr.io/example/api:latest'
          reject missing-digest 'MINDPATTERN_BACKUP_IMAGE=ghcr.io/example/backup'
          reject short-digest "MINDPATTERN_API_IMAGE=ghcr.io/example/api@sha256:abc123"
          reject dotdot-path "MINDPATTERN_API_IMAGE=ghcr.io/example/../api@sha256:$(printf 'a%.0s' {1..64})"
          reject unknown-key 'SOME_OTHER_KEY=value'
          reject malformed-line 'this is not an assignment'
          reject duplicate-key "$(printf 'MINDPATTERN_API_IMAGE=ghcr.io/e/a@sha256:%s\nMINDPATTERN_API_IMAGE=ghcr.io/e/b@sha256:%s\n' \
            "$(printf 'a%.0s' {1..64})" "$(printf 'b%.0s' {1..64})")"

  monitoring-verify:
    # deploy/monitoring/verify.sh is the drift gate for the alerting stack
    # (YAML structure, every alert expression grounded in metrics.py's real
    # exposition, the bearer_token_file contract) and previously ran in NO
    # CI job — the exact decay mode this repo already suffered once
    # (mutation-mobile "had NEVER executed"). Alert or metric drift must be
    # visible in CI, not only on an operator's laptop. Also shellchecks
    # every shell script in the tree, at error severity: the tree's
    # deliberate idioms (`ls -1t` newest-file selection, single-quoted
    # snippets handed to containers) are info/warning-level notes and stay
    # out of the gate; parse and quoting failures still fail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Applies to this job's own shellcheck step AND to verify.sh's
      # internal shellcheck pass (which runs bare `shellcheck` at the
      # default style severity and would trip on those same info notes).
      SHELLCHECK_OPTS: --severity=error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install a PyYAML-carrying python
        # verify.sh's structural pass needs a python that imports yaml; the
        # runner's system python does not ship one. Same pinned, hash-checked
        # runtime set the contract-gates job installs (PyYAML rides along).
        run: python -m pip install --require-hashes -r backend/requirements.lock.txt
      - name: Put promtool on PATH
        # Same image deploy/monitoring/docker-compose.yml ships (tag AND
        # digest, pinned 2026-09-22 audit G-7/NEW-4), so the semantic check
        # validates the rules against the exact Prometheus the stack runs;
        # extracting the binary from the pinned image avoids a second,
        # unpinned download path.
        run: |
          docker create --name promtool-copy prom/prometheus:v3.4.1@sha256:9abc6cf6aea7710d163dbb28d8eeb7dc5baef01e38fa4cd146a406dd9f07f70d
          docker cp promtool-copy:/bin/promtool /usr/local/bin/promtool
          docker rm promtool-copy >/dev/null
          promtool --version
      - name: Monitoring stack verify (YAML + structure + grounding + promtool)
        run: bash deploy/monitoring/verify.sh
      - name: Monitoring digest-pin assertion (--production)
        # Audit G-7/NEW-4 (2026-09-22): the operator overlays' images are
        # pinned at repo:tag@sha256 in the same commit, and this step makes
        # the pin POLICY, not convention — verify.sh --production fails any
        # mutable image ref in the production compose or either overlay, so
        # a dropped/stale digest fails the build instead of surfacing at a
        # 3am `compose pull`. Deliberately a SEPARATE step from the plain
        # verify above so a failure attributes to the pinning contract, not
        # to YAML/grounding drift. Re-pins happen as explicit edits of tag
        # AND digest together (deploy/monitoring/README.md, "Digest
        # pinning").
        run: bash deploy/monitoring/verify.sh --production
      - name: Shellcheck every shell script (error severity)
        run: shellcheck --severity=error $(find . -name '*.sh' -not -path '*/node_modules/*')

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install lint tooling
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        working-directory: backend
        run: python -m mypy
      - name: README error-code list covers every code the backend raises
        # The README's error-contract section claims its code list is
        # COMPLETE (audit A-4: it had silently gone stale). Collect every
        # `code="..."` literal under backend/app plus the status-default
        # envelope map in deps.py and require each to appear in README.md.
        # 2026-09-22 audit round 3: middleware/exception-handler envelopes
        # are built as dict LITERALS (`"code": "..."`), not ApiError
        # kwargs — the first gate iteration's single regex was blind to
        # that whole class. Match both shapes.
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path

          backend = Path("backend/app")
          readme = Path("README.md").read_text(encoding="utf-8")

          codes = set()
          for path in sorted(backend.rglob("*.py")):
              text = path.read_text(encoding="utf-8")
              codes |= set(re.findall(r'code="([a-z0-9_]+)"', text))
              # Dict-literal envelopes (middleware _RATE_LIMITED & friends,
              # exception handlers): same [a-z0-9_] charset, quoted keys.
              codes |= set(re.findall(r'"code"\s*:\s*"([a-z0-9_]+)"', text))
          deps = (backend / "deps.py").read_text(encoding="utf-8")
          defaults = re.search(r"DEFAULT_ERROR_CODES[^{]*\{(.*?)\}", deps, re.S)
          assert defaults, "DEFAULT_ERROR_CODES map not found in backend/app/deps.py"
          codes |= set(re.findall(r':\s*"([a-z0-9_]+)"', defaults.group(1)))

          missing = sorted(c for c in codes if f"`{c}`" not in readme)
          assert not missing, "README.md error-code list is missing: " + ", ".join(missing)
          print(f"README error-code list covers all {len(codes)} raised codes")
          EOF

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: pip-audit the pinned backend supply chain
        working-directory: backend
        # Audits the exact pinned runtime set against the OSV database.
        # Clean as of 2026-09-07 (pip-audit 2.10.1).
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
          pip-audit -r requirements.lock.txt
