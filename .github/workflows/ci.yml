name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # One active run per ref; a new push cancels the now-stale one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          # The complete test/lint closure is resolved once, pinned, and
          # hash-checked.  Never let a PR resolve a new transitive package.
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Backend tests with coverage
        working-directory: backend
        # --cov-fail-under pins the floor at the suite's measured total
        # (97% at the time this gate was added); lower it only deliberately.
        run: python -m pytest tests/ --cov=app --cov-report=term --cov-fail-under=95  # 2026-09-30: measured 95.7% after waves 1-4 added ~600 stmts of new surface; the 97 floor is registered for restoration in docs/SECURITY_RESIDUALS.md
      - name: Verify isolated mutation execution and evidence
        working-directory: backend
        run: python -m unittest discover -s ../tools/tests -p test_deep_mutation_runner.py -v

  backend-postgres:
    # The same suite against real Postgres. conftest.py reads
    # MINDPATTERN_TEST_DB_URL (default stays in-memory SQLite). This job
    # exists because SQLite and Postgres differ on constraint, locking, and
    # type behavior, and Postgres is what docker-compose deploys.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same tag family as docker-compose.yml's db service (digest-pinned
        # there). This is a throwaway service container, so the password is
        # a non-secret CI string, not an operator credential.
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: mindpattern_test
        ports:
          # Loopback-only: a bare 5432:5432 would publish the throwaway
          # database on the runner's public interface too.
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MINDPATTERN_TEST_DB_URL: postgresql+asyncpg://postgres:ci-postgres-password@localhost:5432/mindpattern_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Full suite against Postgres
        working-directory: backend
        # No --cov-fail-under here: coverage is gated in the `backend` job;
        # this job's signal is "the suite passes under Postgres semantics".
        run: python -m pytest tests/
      - name: Preserve legacy ciphertext through the production migration path
        working-directory: backend
        env:
          REMEDIATION_UPGRADE_DB_URL: postgresql+asyncpg://postgres:ci-postgres-password@localhost:5432/ci_upgrade_test
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          async def create():
              conn = await asyncpg.connect('postgresql://postgres:ci-postgres-password@localhost:5432/postgres')
              try:
                  await conn.execute('CREATE DATABASE ci_upgrade_test')
              finally:
                  await conn.close()
          asyncio.run(create())
          PY
          MINDPATTERN_DB_URL="$REMEDIATION_UPGRADE_DB_URL" python -m alembic upgrade a3f7c1d9b5e2
          python ../tools/verify-postgres-upgrade.py

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Verify exact dependency security backports and attack regressions
        working-directory: mobile
        run: node tools/verify_dependency_patches.mjs
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests (global coverage thresholds enforced)
        working-directory: mobile
        run: npm test
      - name: Mobile dependency audit
        working-directory: mobile
        run: npm run audit:dependencies

  android-build:
    # A static preflight cannot detect Expo/Gradle/C++ incompatibilities.
    # Compile from npm ci on every change; signing stays a release input.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact dependencies and verified native compatibility patches
        working-directory: mobile
        run: npm ci
      - name: Install the committed Android SDK toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37' 'build-tools;37.0.0' \
            'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Compile Android application and native modules
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --dependency-verification strict --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Prove Gradle resolution reproduces the committed lock state
        working-directory: mobile/android
        run: |
          ./gradlew :app:dependencies --write-locks --dependency-verification strict --no-daemon --max-workers=2
          git diff --exit-code -- app/gradle.lockfile settings-gradle.lockfile gradle/verification-metadata.xml

  ios-build:
    # Resolve only the committed Ruby/Pod closures, then compile for the
    # simulator without signing. This catches Podfile/Xcode/native-module
    # drift while leaving certificates and store credentials outside CI.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@d354de180d0c9e813cfddfcbdc079945d4be589b # v1.275.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile/ios
      - name: Install exact JavaScript and CocoaPods closures
        working-directory: mobile
        run: |
          npm ci
          cd ios
          bundle exec pod install --deployment
      - name: Compile the iOS app without signing
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace MindPattern.xcworkspace \
            -scheme MindPattern \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  native-release-preflight:
    # mobile/tools/verify_native_release.mjs is the fail-closed gate for the
    # committed native projects (audit E-1, 2026-09-21: ios/ and android/
    # now ship in-tree with the hardening surface — Health usage strings,
    # allowBackup=false, FLAG_SECURE, keychain autolinking). The check ran
    # nowhere before, so the exact "cannot build or install today" decay
    # mode was invisible. It must run on every push: regenerating the
    # projects or touching package.json deps can silently drop a hardening
    # property the preflight exists to police.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies (autolinking inspection needs the CLI)
        working-directory: mobile
        run: npm ci
      - name: Native release preflight
        working-directory: mobile
        run: npm run verify:native-release

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install dependencies
        working-directory: portal
        run: npm ci
      - name: Typecheck
        working-directory: portal
        run: npx tsc --noEmit
      - name: Portal tests (cross-platform vectors + coverage thresholds)
        working-directory: portal
        run: npm test
      - name: Production build
        working-directory: portal
        run: npm run build
      - name: Portal dependency audit
        working-directory: portal
        run: npm audit --audit-level=moderate

  web:
    # Patient web client (docs/plans/web-plan.md) — same gate shape as the portal:
    # typecheck, tests (security-config pins, platform seam, XSS floor),
    # production build, and a hard dependency audit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Web tests (security-config pins + coverage thresholds)
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Web dependency audit
        working-directory: web
        run: npm audit --audit-level=moderate

  web-contract-vectors:
    # WEB_PLAN P9.2 (four-way verification): the web client's crypto/brain
    # suites ARE the fourth leg of the cross-platform vector check —
    # backend (pytest), mobile (vitest), portal (vitest), web (vitest) all
    # pass the SAME shared/vectors.json + brain_vectors.json +
    # interop_fixtures.json. Kept as its own job so a web crypto drift is
    # visible as exactly that, not a generic test failure.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Cross-platform vectors (crypto + brain + interop fixtures)
        working-directory: web
        run: npx vitest run tests/crypto.test.ts tests/crypto.pins.test.ts tests/brainVectors.test.ts tests/interop.test.ts tests/contractPins.test.ts

  contract-gates:
    # The repo's two standalone proof tools, wired as gates (they were built
    # for this and previously ran only by hand):
    # - backend/probe_brain.py: planted-pattern corpus the brain must get
    #   right (9/9, zero false associations); exits non-zero on any FAIL.
    # - mobile/tools/verify_vectors.mjs: cross-platform crypto vectors run
    #   over the REAL compiled TS modules — npm ci is required so
    #   node_modules/.bin/tsc exists; without it the tool falls back to a
    #   weaker webcrypto reference check that cannot see app-code bugs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Backend deps for the probe
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
      - name: Mobile deps for the real-module vector check
        working-directory: mobile
        run: npm ci
      - name: Ground-truth brain probe (9/9 required)
        working-directory: backend
        run: python probe_brain.py
      - name: Cross-platform crypto vectors
        working-directory: mobile
        run: node tools/verify_vectors.mjs

  docker:
    # Verifies deployable artifacts end to end: both images build, the
    # compose stack boots, migrations land, health probes answer, and an
    # encrypted/authenticated backup can really be restored.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a throwaway .env and secret files
        # Random per run; nothing here survives `compose down -v` below.
        # The secrets mount as FILES (2026-09-26 infra audit): the compose
        # file reads them from deploy/secrets/, which is gitignored — CI
        # materializes throwaway copies the same way it writes .env.
        # Pentest 2026-09-29 (MED-1): POSTGRES_PASSWORD lives ONLY in
        # deploy/secrets/postgres_password now. The api container never
        # receives it (no MINDPATTERN_DB_URL interpolation anywhere) —
        # backend/docker-entrypoint.sh assembles the URL from the mounted
        # secret — so there is no .env copy to keep in sync.
        run: |
          set -euo pipefail
          pg_password=$(openssl rand -hex 16)
          test -n "$pg_password" || { echo "::error::openssl produced an empty password" >&2; exit 1; }
          {
            # The checked-in production compose file consumes published
            # image references only.  CI intentionally opts into the
            # explicit local source-build overlay.
            echo "MINDPATTERN_API_IMAGE=mindpattern-api:ci"
            echo "MINDPATTERN_BACKUP_IMAGE=mindpattern-backup:ci"
          } > .env
          mkdir -p deploy/secrets
          printf '%s\n' "$pg_password" > deploy/secrets/postgres_password
          openssl rand -hex 32 > deploy/secrets/token_secret
          for name in auth_token_secret totp_wrap_secret pairing_secret decoy_secret audit_mac_secret; do
            openssl rand -hex 32 > "deploy/secrets/$name"
          done
          : > deploy/secrets/audit_mac_previous_secrets
          openssl rand -base64 32 > deploy/secrets/backup_key
          # Independent audit 2026-09-27: the metrics token rides the same
          # file-mount chain (api MINDPATTERN_METRICS_TOKEN_FILE); ONE
          # generated value, no env-var plaintext hop.
          openssl rand -hex 16 > deploy/secrets/metrics_token
          chmod 600 .env deploy/secrets/postgres_password \
            deploy/secrets/token_secret deploy/secrets/auth_token_secret \
            deploy/secrets/totp_wrap_secret deploy/secrets/pairing_secret \
            deploy/secrets/decoy_secret deploy/secrets/audit_mac_secret \
            deploy/secrets/audit_mac_previous_secrets \
            deploy/secrets/backup_key deploy/secrets/metrics_token
          # 2026-09-28 audit L-4: the monitoring stack reads its COPY of the
          # same token from deploy/monitoring/token (prometheus
          # bearer_token_file). ONE value into BOTH sinks, then the
          # equality assertion the compose header promises — divergence
          # would 401 every scrape with nothing to catch it.
          mkdir -p deploy/monitoring
          cp deploy/secrets/metrics_token deploy/monitoring/token
          chmod 600 deploy/monitoring/token
          cmp -s deploy/secrets/metrics_token deploy/monitoring/token \
            || { echo '::error::metrics token sinks diverged' >&2; exit 1; }
      - name: Assert secret values never reach a container environment
        # Pentest 2026-09-29 (MED-1): the api used to receive
        # MINDPATTERN_DB_URL with ${POSTGRES_PASSWORD} interpolated raw
        # into its environment — readable via `docker inspect`. The fixed
        # contract is the NEGATIVE of the old assertion: the RENDERED
        # compose (what containers actually receive) must contain neither
        # the URL nor the password anywhere in the api service, and the
        # api must mount the SAME postgres_password secret the db reads
        # (docker-entrypoint.sh assembles the URL from it in-process).
        run: |
          set -euo pipefail
          secret_files=(token_secret auth_token_secret totp_wrap_secret pairing_secret decoy_secret audit_mac_secret metrics_token postgres_password backup_key)
          for name in "${secret_files[@]}"; do
            test -s "deploy/secrets/$name" \
              || { echo "::error::deploy/secrets/$name is missing or empty" >&2; exit 1; }
          done
          test -f deploy/secrets/audit_mac_previous_secrets \
            || { echo "::error::required audit history file is missing" >&2; exit 1; }
          rendered_json=$(mktemp)
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --format json > "$rendered_json"
          if jq -e '.services.api.environment | has("MINDPATTERN_DB_URL")' "$rendered_json" >/dev/null; then
            echo "::error::rendered compose still carries MINDPATTERN_DB_URL — the api environment must never contain it (MED-1 regression)" >&2
            exit 1
          fi
          for key in MINDPATTERN_TOKEN_SECRET MINDPATTERN_AUTH_TOKEN_SECRET \
                     MINDPATTERN_TOTP_WRAP_SECRET MINDPATTERN_PAIRING_SECRET \
                     MINDPATTERN_DECOY_SECRET MINDPATTERN_AUDIT_MAC_SECRET \
                     MINDPATTERN_AUDIT_MAC_PREVIOUS_SECRETS \
                     MINDPATTERN_METRICS_TOKEN; do
            if jq -e --arg key "$key" '.services.api.environment | has($key)' "$rendered_json" >/dev/null; then
              echo "::error::rendered api environment exposes $key instead of file-only delivery" >&2
              exit 1
            fi
          done
          if jq -e '.services.backup.environment | has("BACKUP_KEY")' "$rendered_json" >/dev/null; then
            echo "::error::rendered backup environment exposes BACKUP_KEY instead of file-only delivery" >&2
            exit 1
          fi
          for name in "${secret_files[@]}"; do
            value=$(cat "deploy/secrets/$name")
            if grep -qF "$value" "$rendered_json"; then
              echo "::error::rendered compose contains plaintext from deploy/secrets/$name" >&2
              exit 1
            fi
          done
          echo "compose render: all credentials are non-empty file mounts and no plaintext secret is present"
      - name: Validate compose and build both local source images
        # --progress=plain (2026-09-26): a bare "build" failure reports
        # only the failing stage; the plain renderer shows the compile/apt
        # output needed to diagnose digest/base drift from the run log.
        run: |
          docker pull cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build --progress=plain
      - name: Trivy vulnerability scan of both built images (2026-09-21 audit G-6)
        # OS-package coverage pip-audit/npm cannot see (the backend image
        # compiles asyncpg against live apt). Fixable HIGH/CRITICAL
        # findings fail the job. The scanner itself is digest-pinned
        # (final verification 2026-09-22) to match the repo's no-mutable-ref
        # policy; re-pin deliberately, like the deploy images.
        run: |
          set -euo pipefail
          for image in mindpattern-api:ci mindpattern-backup:ci; do
            echo "trivy: scanning $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.61.0@sha256:6967db29ce5294d054121e94b3cb1262de858af63b4547bb1bade66a4306f2e4 image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress "$image"
          done
      - name: Start the stack
        # --wait blocks until every service's healthcheck passes (the api
        # healthcheck is the same urllib probe the Dockerfile ships).
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
      - name: Assert health endpoints
        # /healthz is the liveness probe; /readyz proves the DB is usable
        # (SELECT 1). The retry loop covers healthcheck-flap races --wait
        # cannot see.
        run: |
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error \
            http://127.0.0.1:8000/healthz
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error \
            http://127.0.0.1:8000/readyz
      - name: Assert migrations are at head
        # The entrypoint ran `alembic upgrade head` before uvicorn; verify
        # the result instead of trusting the boot log. Pentest 2026-09-29
        # (MED-1): MINDPATTERN_DB_URL is no longer static container config —
        # the entrypoint assembles it and passes it across the final `exec
        # uvicorn`, so it lives in PID 1's environment. `compose exec` gets
        # only the static config env, so source the URL from /proc/1/environ.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T api sh -c \
            'export MINDPATTERN_DB_URL="$(tr "\0" "\n" < /proc/1/environ | sed -n "s/^MINDPATTERN_DB_URL=//p")"; test -n "$MINDPATTERN_DB_URL" || { echo "::error::PID 1 carries no MINDPATTERN_DB_URL" >&2; exit 1; }; alembic current' \
            | grep -q "(head)"
      - name: Seed a row that a backup restore must reproduce
        # Archive parsing alone cannot prove pg_restore can apply schema/data.
        # Seed through the public API so the backup assertion includes a real
        # migrated application row, not only empty tables.
        run: |
          curl --fail --silent --show-error --output /dev/null \
            -H 'Content-Type: application/json' \
            --data '{"username":"backup-restore-probe","salt":"AAAAAAAAAAAAAAAAAAAAAA==","verifier":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=","age_attestation":"minimum_age_confirmed_v1"}' \
            http://127.0.0.1:8000/api/v1/auth/register
      - name: Create, authenticate, and actually restore a backup
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups up -d backup
          found=0
          attempt=1
          while [ "$attempt" -le 20 ]; do
            if docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups exec -T backup sh -ceu '
              set -- /backups/mindpattern-*.dump.enc
              test -f "$1"
              test -f "$1.hmac"
            '; then
              found=1
              break
            fi
            sleep 3
            attempt=$((attempt + 1))
          done
          test "$found" = 1
          restore_name="mindpattern-restore-${GITHUB_RUN_ID:-local}-${RANDOM}"
          # Digest matches docker-compose.yml's db service (re-pinned
          # 2026-09-26; the previous cf78e766… pin was superseded — see the
          # deploy/README.md digest-pin inventory).
          docker run --rm -d --name "$restore_name" -e POSTGRES_PASSWORD=restore \
            postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea >/dev/null
          cleanup_restore() { docker rm -f "$restore_name" >/dev/null 2>&1 || true; }
          trap cleanup_restore EXIT
          for attempt in $(seq 1 20); do
            docker exec "$restore_name" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$restore_name" pg_isready -U postgres >/dev/null
          # HMAC verification MUST precede decryption. pipefail ensures a
          # failed verifier/decryptor cannot be masked by pg_restore.
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups exec -T backup sh -ceu '
            set -- /backups/mindpattern-*.dump.enc
            mindpattern-backup-mac decrypt "$1"
          ' | docker exec -i "$restore_name" pg_restore --no-owner -U postgres -d postgres
          docker exec "$restore_name" psql -U postgres -d postgres -tAc \
            "SELECT count(*) FROM users WHERE username = 'backup-restore-probe'" | grep -qx '1'
          docker exec "$restore_name" psql -U postgres -d postgres -tAc \
            "SELECT to_regclass('public.alembic_version')" | grep -qx 'alembic_version'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile backups down -v

  release-env-contract:
    # Exercises deploy/verify-release-env.sh on every push: the script is
    # the digest-pinning enforcement point for releases and the documented
    # operator flow, and it once shipped non-executable (mode 644) without
    # any CI path noticing. Both halves are pinned: it must execute as
    # committed (proving the +x bit), accept a valid digest-pinned env,
    # and reject every invalid shape.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove the committed script is executable
        run: |
          test -x deploy/verify-release-env.sh
      - name: Accepts a valid digest-pinned environment
        run: |
          printf 'MINDPATTERN_API_IMAGE=ghcr.io/example/mindpattern-api@sha256:%s\nMINDPATTERN_BACKUP_IMAGE=ghcr.io/example/mindpattern-backup@sha256:%s\n' \
            "$(printf 'a%.0s' {1..64})" "$(printf 'b%.0s' {1..64})" > /tmp/valid.env
          deploy/verify-release-env.sh /tmp/valid.env
      - name: Rejects every invalid shape
        run: |
          reject() {
            printf '%s\n' "$2" > "/tmp/bad-$1.env"
            if deploy/verify-release-env.sh "/tmp/bad-$1.env" >/dev/null 2>&1; then
              echo "::error::verify-release-env.sh accepted invalid case: $1"
              exit 1
            fi
          }
          reject floating-tag 'MINDPATTERN_API_IMAGE=ghcr.io/example/api:latest'
          reject missing-digest 'MINDPATTERN_BACKUP_IMAGE=ghcr.io/example/backup'
          reject short-digest "MINDPATTERN_API_IMAGE=ghcr.io/example/api@sha256:abc123"
          reject dotdot-path "MINDPATTERN_API_IMAGE=ghcr.io/example/../api@sha256:$(printf 'a%.0s' {1..64})"
          reject unknown-key 'SOME_OTHER_KEY=value'
          reject malformed-line 'this is not an assignment'
          reject duplicate-key "$(printf 'MINDPATTERN_API_IMAGE=ghcr.io/e/a@sha256:%s\nMINDPATTERN_API_IMAGE=ghcr.io/e/b@sha256:%s\n' \
            "$(printf 'a%.0s' {1..64})" "$(printf 'b%.0s' {1..64})")"

  remediation-contracts:
    # Prove backend/tooling contracts and the quality gates themselves.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install hash-locked backend tooling dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Verify the automatic mutation runner in a clean parent process
        working-directory: backend
        run: python -m pytest ../tools/tests/test_automatic_backend_mutation.py ../tools/tests/test_automatic_http_contracts.py -q
      - name: Check backup and campaign/mutation evidence contracts
        working-directory: backend
        # The fork harness requires a parent without imported application modules.
        run: >-
          python -m pytest ../tools/tests
          --ignore=../tools/tests/test_automatic_backend_mutation.py
          --ignore=../tools/tests/test_automatic_http_contracts.py -q
      - name: Verify backend utility and probe contracts
        working-directory: backend
        run: MINDPATTERN_ENV=development python -m pytest ../redteam/automatic_backend_script_oracles.py -q
      - name: Validate every behavioral mutation anchor and test selector without changing source
        run: |
          python redteam/run_pr_mutation_gate.py --preflight
          python redteam/deep_backend_mutation/runner.py --preflight

  monitoring-verify:
    # deploy/monitoring/verify.sh is the drift gate for the alerting stack
    # (YAML structure, every alert expression grounded in metrics.py's real
    # exposition, the bearer_token_file contract) and previously ran in NO
    # CI job — the exact decay mode this repo already suffered once
    # (mutation-mobile "had NEVER executed"). Alert or metric drift must be
    # visible in CI, not only on an operator's laptop. Also shellchecks
    # every shell script in the tree, at error severity: the tree's
    # deliberate idioms (`ls -1t` newest-file selection, single-quoted
    # snippets handed to containers) are info/warning-level notes and stay
    # out of the gate; parse and quoting failures still fail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Applies to this job's own shellcheck step AND to verify.sh's
      # internal shellcheck pass (which runs bare `shellcheck` at the
      # default style severity and would trip on those same info notes).
      SHELLCHECK_OPTS: --severity=error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install a PyYAML-carrying python
        # verify.sh's structural pass needs a python that imports yaml; the
        # runner's system python does not ship one. Same pinned, hash-checked
        # runtime set the contract-gates job installs (PyYAML rides along).
        run: python -m pip install --require-hashes -r backend/requirements.lock.txt
      - name: Put promtool on PATH
        # Same image deploy/monitoring/docker-compose.yml ships (tag AND
        # digest, pinned 2026-09-22 audit G-7/NEW-4), so the semantic check
        # validates the rules against the exact Prometheus the stack runs;
        # extracting the binary from the pinned image avoids a second,
        # unpinned download path.
        run: |
          docker create --name promtool-copy prom/prometheus:v3.4.1@sha256:9abc6cf6aea7710d163dbb28d8eeb7dc5baef01e38fa4cd146a406dd9f07f70d
          docker cp promtool-copy:/bin/promtool /usr/local/bin/promtool
          docker rm promtool-copy >/dev/null
          promtool --version
      - name: Monitoring stack verify (YAML + structure + grounding + promtool)
        run: bash deploy/monitoring/verify.sh
      - name: Monitoring digest-pin assertion (--production)
        # Audit G-7/NEW-4 (2026-09-22): the operator overlays' images are
        # pinned at repo:tag@sha256 in the same commit, and this step makes
        # the pin POLICY, not convention — verify.sh --production fails any
        # mutable image ref in the production compose or either overlay, so
        # a dropped/stale digest fails the build instead of surfacing at a
        # 3am `compose pull`. Deliberately a SEPARATE step from the plain
        # verify above so a failure attributes to the pinning contract, not
        # to YAML/grounding drift. Re-pins happen as explicit edits of tag
        # AND digest together (deploy/monitoring/README.md, "Digest
        # pinning").
        run: bash deploy/monitoring/verify.sh --production
      - name: Compose image digest-drift gate
        # 2026-09-26 infra audit: dependabot has no compose ecosystem, so a
        # pinned base can age behind its moving tag (the 2026-09-07
        # postgres pin sat ~6 weeks stale behind Trivy failures). The gate
        # resolves each repo:tag@sha256 pin against the live registry and
        # fails when the tag moved AND the pin is >90 days old per the
        # deploy/README.md inventory — a re-pin becomes scheduled, not
        # accidental.
        run: |
          # Selftest first (independent audit 2026-09-27): prove the gate's
          # failure modes actually fail — moved/stale pin, missing
          # inventory row, deleted tag, transport failure — before
          # trusting the live registry walk below.
          bash deploy/monitoring/check-image-drift.sh --selftest
          bash deploy/monitoring/check-image-drift.sh
      - name: Shellcheck every shell script (error severity)
        run: shellcheck --severity=error $(find . -name '*.sh' -not -path '*/node_modules/*')

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install lint tooling
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        working-directory: backend
        run: python -m mypy
      - name: Documentation links and API error-code coverage
        run: python tools/check-docs.py

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: pip-audit the pinned backend supply chain
        working-directory: backend
        # Audits the exact pinned runtime set against the OSV database.
        # Clean as of 2026-09-07 (pip-audit 2.10.1).
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
          pip-audit -r requirements.lock.txt

  secrets:
    # Secret-scanning gate (audit F-4, 2026-09-26): gitleaks over the full
    # git history AND the working tree. The binary is version- and
    # sha256-pinned like every other external tool in this pipeline, and
    # every allowlist entry in .gitleaks.toml carries a written defense.
    # Clean as of 2026-09-26 (gitleaks 8.30.1).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and later removed stays a leak.
          fetch-depth: 0
      - name: Install gitleaks (version + sha256 pinned)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Prove exact public exceptions preserve all three scan modes
        run: python3 tools/verify_secret_scan.py
      - name: Scan full git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
      - name: Scan working tree (untracked files included)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1
