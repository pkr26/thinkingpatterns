name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # matches the dev venv and the Docker base image
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Runtime deps come from the pinned lock file — the same set the
          # suite was verified against; test tooling is unpinned dev-only.
          pip install -r requirements.lock.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Backend tests with coverage
        working-directory: backend
        run: python -m pytest tests/ --cov=app --cov-report=term

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests (98% per-file coverage thresholds enforced)
        working-directory: mobile
        run: npm test
