name: Release

# The delivery pipeline (2026-09-17). CI gates every push; THIS workflow
# ships: on a v* tag it re-runs the fast verification spine, builds the
# production image, pushes it to GHCR (multi-arch), and opens a GitHub
# release seeded from the matching CHANGELOG entry.
#
# Secrets/permissions: GITHUB_TOKEN only, image pushed to the same
# repository's registry namespace. Nothing here touches production
# infrastructure — deployment is the operator's compose/k8s pull, by
# design (the deployment contract is one host per database; see
# backend/app/singleprocess.py and the cross-host boot guard).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege workflow-wide: every job can read the repo. The two
# jobs that ship artifacts (image -> GHCR, release-notes -> GitHub
# release) declare their own broader grants below.
permissions:
  contents: read

env:
  PYTEST_PINS: "pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install $PYTEST_PINS
      - name: Full backend suite (no coverage floor on the release spine — CI already gated it)
        working-directory: backend
        run: python -m pytest tests/ -m "not slow" -q
      - name: Ground-truth probe (9/9)
        working-directory: backend
        run: python probe_brain.py

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    # Tag pushes only: publish a GitHub release seeded with the matching
    # CHANGELOG.md section (everything between the version heading and the
    # next heading).
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract the CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/notes.md
          # Empty extraction is a release blocker: the notes ARE the
          # contract (what shipped and why).
          test -s /tmp/notes.md || { echo "no CHANGELOG.md section for $VERSION" >&2; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
