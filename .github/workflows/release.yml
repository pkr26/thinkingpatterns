name: Release

# The delivery pipeline (2026-09-17). CI gates every push; THIS workflow
# ships: on a v* tag it re-runs every code-controlled release gate, builds
# the API and backup-worker images, pushes both to GHCR (multi-arch +
# provenance/SBOM), and opens a GitHub release seeded from the matching
# CHANGELOG entry.
#
# Secrets/permissions: GITHUB_TOKEN only, image pushed to the same
# repository's registry namespace. Nothing here touches production
# infrastructure — deployment is the operator's compose/k8s pull, by
# design (the deployment contract is one host per database; see
# backend/app/singleprocess.py and the cross-host boot guard).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege workflow-wide: every job can read the repo. The two
# jobs that ship artifacts (image -> GHCR, release-notes -> GitHub
# release) declare their own broader grants below.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag and changelog contract before any artifact can publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:?missing Git ref name}"
          # Tags are public release identifiers and flow into image tags,
          # asset names, and the GitHub release.  Accept conventional
          # vMAJOR.MINOR.PATCH plus an optional prerelease suffix only.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "invalid release tag $tag; expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE" >&2
            exit 1
          fi
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || {
            echo "no CHANGELOG.md section for $version" >&2
            exit 1
          }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 2026-09-21 audit G-7: the coverage gate runs on the SAME
          # interpreter the production image ships (3.14) — it used to
          # gate on 3.12 while production ran 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            portal/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Backend tests, static checks, and supply-chain audit
        working-directory: backend
        run: |
          python -m pytest tests/ --cov=app --cov-report=term --cov-fail-under=97
          ruff check .
          ruff format --check .
          python -m mypy
          pip-audit -r requirements.lock.txt
      - name: Ground-truth probe (9/9)
        working-directory: backend
        run: python probe_brain.py
      - name: Mobile test, type, crypto, and dependency gates
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run verify:vectors
          npm audit --audit-level=moderate
      - name: Portal test, build, and dependency gates
        working-directory: portal
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Web (patient client) test, build, and dependency gates
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Package the verified portal deployment artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          archive="mindpattern-portal-${GITHUB_REF_NAME:?missing Git ref name}.tar.gz"
          tar -C portal -czf "$archive" dist
          sha256sum "$archive" > "$archive.sha256"
          web_archive="mindpattern-web-${GITHUB_REF_NAME:?missing Git ref name}.tar.gz"
          tar -C web -czf "$web_archive" dist
          sha256sum "$web_archive" > "$web_archive.sha256"
      - name: Preserve the verified portal deployment artifact for this release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: verified-portal-${{ github.sha }}
          path: |
            mindpattern-portal-${{ github.ref_name }}.tar.gz
            mindpattern-portal-${{ github.ref_name }}.tar.gz.sha256
            mindpattern-web-${{ github.ref_name }}.tar.gz
            mindpattern-web-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          # The GitHub Release below is the durable delivery artifact. This
          # workflow artifact only bridges verified build -> release job.
          retention-days: 1

  postgres:
    # A tag must exercise the real production database dialect, not merely
    # the in-memory SQLite unit path. This mirrors CI's Postgres contract
    # and runs on the same Python version used in the production image.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: mindpattern_test
        ports:
          # Loopback-only: a bare 5432:5432 would publish the throwaway
          # database on the runner's public interface too.
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MINDPATTERN_TEST_DB_URL: postgresql+asyncpg://postgres:ci-postgres-password@localhost:5432/mindpattern_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install locked test closure
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Full suite against Postgres
        working-directory: backend
        run: python -m pytest tests/

  production-integration:
    # Pull and run the exact immutable candidate images built by `image`.
    # This must happen before human-facing release/latest tags are created:
    # no later Dockerfile rebuild may substitute a different artifact.
    needs: [verify, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a throwaway compose environment and secret files
        # The production compose is FAIL-CLOSED on compose `secrets:` mounts
        # (2026-09-26 infra audit): .env alone is not enough — `compose up`
        # refuses to start until all four files under deploy/secrets/
        # (MINDPATTERN_SECRETS_DIR default, ./deploy/secrets relative to this
        # checkout) exist. Materialize them from the SAME single-generation
        # values the .env carries (one `openssl rand` per secret, two sinks);
        # auth_token_secret is deliberately empty per the documented
        # derive-from-token_secret path. Re-audit 2026-09-27: the first
        # tagged release previously died at `compose up` with no secret
        # files on disk at all.
        run: |
          set -euo pipefail
          token_secret=$(openssl rand -hex 32)
          pg_password=$(openssl rand -hex 16)
          backup_key=$(openssl rand -base64 32)
          test -n "$token_secret" && test -n "$pg_password" && test -n "$backup_key" \
            || { echo "::error::openssl produced an empty secret" >&2; exit 1; }
          {
            echo "MINDPATTERN_TOKEN_SECRET=$token_secret"
            echo "POSTGRES_PASSWORD=$pg_password"
            echo "BACKUP_KEY=$backup_key"
            echo "MINDPATTERN_API_IMAGE=${{ needs.image.outputs.api_image }}"
            echo "MINDPATTERN_BACKUP_IMAGE=${{ needs.image.outputs.backup_image }}"
          } > .env
          mkdir -p deploy/secrets
          printf '%s\n' "$token_secret" > deploy/secrets/token_secret
          : > deploy/secrets/auth_token_secret
          printf '%s\n' "$pg_password" > deploy/secrets/postgres_password
          printf '%s\n' "$backup_key" > deploy/secrets/backup_key
          chmod 600 .env deploy/secrets/token_secret \
            deploy/secrets/auth_token_secret deploy/secrets/postgres_password \
            deploy/secrets/backup_key
      - name: Assert the db password is ONE value across .env and the secret file
        # Same fail-fast contract as ci.yml's docker job (re-audit
        # 2026-09-27): the api interpolates POSTGRES_PASSWORD from .env into
        # MINDPATTERN_DB_URL while the db reads the mounted secret file;
        # divergence means `up --wait` fails deep into the job. Assert the
        # two sinks agree AND that the rendered compose contract carries the
        # file's value, before any image is pulled.
        run: |
          set -euo pipefail
          for f in .env deploy/secrets/token_secret deploy/secrets/auth_token_secret \
                   deploy/secrets/postgres_password deploy/secrets/backup_key; do
            test -f "$f" || { echo "::error::required file $f was not written by the previous step" >&2; exit 1; }
          done
          env_password=$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)
          file_password=$(cat deploy/secrets/postgres_password)
          if [ -z "$env_password" ]; then
            echo "::error::.env carries no POSTGRES_PASSWORD" >&2
            exit 1
          fi
          if [ "$env_password" != "$file_password" ]; then
            echo "::error::POSTGRES_PASSWORD mismatch: .env and deploy/secrets/postgres_password hold DIFFERENT values — the api's MINDPATTERN_DB_URL could never authenticate to the db" >&2
            exit 1
          fi
          rendered_url=$(docker compose config \
            | sed -n 's/^[[:space:]]*MINDPATTERN_DB_URL:[[:space:]]*//p' | head -n 1)
          case "$rendered_url" in
            *"$file_password"*)
              echo "compose render: api MINDPATTERN_DB_URL contains the deploy/secrets/postgres_password value"
              ;;
            *)
              echo "::error::rendered MINDPATTERN_DB_URL does not contain the postgres_password file's value (compose render drifted from the .env contract): ${rendered_url:-<empty>}" >&2
              exit 1
              ;;
          esac
      - name: Validate the digest-pinned production Compose contract
        run: |
          docker compose config --quiet
          docker compose pull
      - name: Start migrated stack and assert health
        run: |
          docker compose up -d --wait
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error http://127.0.0.1:8000/healthz
          curl --retry 10 --retry-delay 3 --retry-all-errors --fail --silent --show-error http://127.0.0.1:8000/readyz
          docker compose exec -T api alembic current | grep -q "(head)"
      - name: Seed a row that a backup restore must reproduce
        run: |
          curl --fail --silent --show-error --output /dev/null \
            -H 'Content-Type: application/json' \
            --data '{"username":"backup-restore-probe","salt":"AAAAAAAAAAAAAAAAAAAAAA==","verifier":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}' \
            http://127.0.0.1:8000/api/v1/auth/register
      - name: Create, authenticate, and actually restore a backup
        run: |
          set -euo pipefail
          docker compose --profile backups up -d backup
          found=0
          attempt=1
          while [ "$attempt" -le 20 ]; do
            if docker compose --profile backups exec -T backup sh -ceu '
              set -- /backups/mindpattern-*.dump.enc
              test -f "$1"
              test -f "$1.hmac"
            '; then
              found=1
              break
            fi
            sleep 3
            attempt=$((attempt + 1))
          done
          test "$found" = 1
          restore_name="mindpattern-restore-${GITHUB_RUN_ID:-local}-${RANDOM}"
          # Digest matches docker-compose.yml's db service (re-pinned
          # 2026-09-26; the previous cf78e766… pin was superseded — see the
          # deploy/README.md digest-pin inventory).
          docker run --rm -d --name "$restore_name" -e POSTGRES_PASSWORD=restore \
            postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea >/dev/null
          cleanup_restore() { docker rm -f "$restore_name" >/dev/null 2>&1 || true; }
          trap cleanup_restore EXIT
          for attempt in $(seq 1 20); do
            docker exec "$restore_name" pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$restore_name" pg_isready -U postgres >/dev/null
          # -pass file: (re-audit 2026-09-27, aligned with ci.yml): the key
          # travels via the mounted /run/secrets/backup_key the compose
          # contract guarantees, not a container-environment copy.
          docker compose --profile backups exec -T backup sh -ceu '
            set -- /backups/mindpattern-*.dump.enc
            mindpattern-backup-mac verify "$1"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass file:/run/secrets/backup_key -in "$1"
          ' | docker exec -i "$restore_name" pg_restore --no-owner -U postgres -d postgres
          docker exec "$restore_name" psql -U postgres -d postgres -tAc \
            "SELECT count(*) FROM users WHERE username = 'backup-restore-probe'" | grep -qx '1'
          docker exec "$restore_name" psql -U postgres -d postgres -tAc \
            "SELECT to_regclass('public.alembic_version')" | grep -qx 'alembic_version'
      - name: Tear down
        if: always()
        run: docker compose --profile backups down -v

  image:
    # A private-to-the-workflow candidate tag is pushed once, then this exact
    # manifest-list digest is pulled by production-integration. This job
    # attaches NO human-facing release tags (final verification 2026-09-22:
    # the old comment described tag-push steps that do not exist) — the
    # deployment contract is digest-only: repo@sha256 references exposed in
    # the release env asset, consumed verbatim by deploy/README.md.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # Exposed separately so the release asset and any future deploy job
      # can consume the immutable manifest-list digests rather than tags.
      api_digest: ${{ steps.api-image.outputs.digest }}
      backup_digest: ${{ steps.backup-image.outputs.digest }}
      api_image: ${{ steps.image-references.outputs.api_image }}
      backup_image: ${{ steps.image-references.outputs.backup_image }}
      api_repository: ${{ steps.candidate-tags.outputs.api_repository }}
      backup_repository: ${{ steps.candidate-tags.outputs.backup_repository }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select unique immutable-candidate tags
        id: candidate-tags
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          api_repository="ghcr.io/$repository"
          backup_repository="ghcr.io/$repository-backup"
          candidate="candidate-${GITHUB_RUN_ID:?missing run id}-${GITHUB_RUN_ATTEMPT:?missing run attempt}"
          {
            echo "api_tag=${api_repository}:${candidate}"
            echo "backup_tag=${backup_repository}:${candidate}"
            echo "api_repository=$api_repository"
            echo "backup_repository=$backup_repository"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the immutable candidate API image
        id: api-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.candidate-tags.outputs.api_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Build and push the immutable candidate backup-worker image
        id: backup-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backup
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.candidate-tags.outputs.backup_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Build single-arch local copies for pre-push scanning
        # 2026-09-26 infra audit (latent Trivy failure root-caused): the
        # multi-platform builds above never load into the local daemon
        # (load: is single-platform-only), so a by-tag Trivy scan via
        # docker.sock had NOTHING to scan and fell back to an
        # unauthenticated registry pull that cannot see the just-pushed
        # private candidate; on non-tag runs (push=false) there was no
        # image anywhere at all. These cache-warm single-arch copies give
        # the scanner real bytes in every mode; tag pushes additionally
        # scan the pushed immutable digests by registry auth below.
        id: local-images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          platforms: linux/amd64
          push: false
          load: true
          tags: mindpattern-api:release-scan
          cache-from: type=gha
      - name: Build single-arch local backup copy for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backup
          platforms: linux/amd64
          push: false
          load: true
          tags: mindpattern-backup:release-scan
          cache-from: type=gha
      - name: Trivy vulnerability scan of the candidate images (audit G-6)
        # 2026-09-21 audit G-6: OS-package coverage the dependency audits
        # (pip-audit/npm) cannot see. HIGH/CRITICAL findings with a fix
        # available fail the release. The scanner itself is digest-pinned
        # (final verification 2026-09-22), matching the ci.yml docker job.
        # Scans the locally-loaded single-arch copies (same layer bytes via
        # build-cache reuse) and, on tag pushes, the PUSHED immutable
        # digests of both images via registry auth — the exact artifacts
        # deployers pull.
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scan() {
            echo "trivy: scanning $1"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy:0.61.0@sha256:6967db29ce5294d054121e94b3cb1262de858af63b4547bb1bade66a4306f2e4 image \
              --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --no-progress "$1"
          }
          scan mindpattern-api:release-scan
          scan mindpattern-backup:release-scan
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            scan "${{ steps.candidate-tags.outputs.api_repository }}@${{ steps.api-image.outputs.digest }}"
            scan "${{ steps.candidate-tags.outputs.backup_repository }}@${{ steps.backup-image.outputs.digest }}"
          fi
      - name: Install cosign (keyless signing)
        # 2026-09-26 infra audit: provenance/SBOM attestation was configured
        # but nothing was ever SIGNED — an external auditor would find zero
        # signature records. Cosign keyless signs with the runner's OIDC
        # identity; deploy/README.md documents verification.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0
      - name: Sign both pushed digests (cosign keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          API_IMAGE: ${{ steps.candidate-tags.outputs.api_repository }}@${{ steps.api-image.outputs.digest }}
          BACKUP_IMAGE: ${{ steps.candidate-tags.outputs.backup_repository }}@${{ steps.backup-image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$API_IMAGE"
          cosign sign --yes "$BACKUP_IMAGE"
      - name: Expose immutable candidate deployment image references
        id: image-references
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          API_IMAGE_REPOSITORY: ${{ steps.candidate-tags.outputs.api_repository }}
          BACKUP_IMAGE_REPOSITORY: ${{ steps.candidate-tags.outputs.backup_repository }}
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          for digest_name in API_DIGEST BACKUP_DIGEST; do
            digest=${!digest_name}
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "$digest_name is not a manifest digest: $digest" >&2
              exit 1
            }
          done
          api_image="${API_IMAGE_REPOSITORY}@${API_DIGEST}"
          backup_image="${BACKUP_IMAGE_REPOSITORY}@${BACKUP_DIGEST}"
          {
            echo "api_image=$api_image"
            echo "backup_image=$backup_image"
          } >> "$GITHUB_OUTPUT"

  release-notes:
    # Tag pushes only: publish a GitHub release seeded with the matching
    # CHANGELOG.md section (everything between the version heading and the
    # next heading). Gated on the Postgres suite and the pull-run-restore
    # integration check of the exact candidate digests: the release assets
    # are the deployment contract and must never publish while those fail.
    needs: [image, postgres, production-integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the portal artifact built and tested by verify
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-portal-${{ github.sha }}
          path: release-assets
      - name: Write the digest-pinned production Compose env asset
        env:
          MINDPATTERN_API_IMAGE: ${{ needs.image.outputs.api_image }}
          MINDPATTERN_BACKUP_IMAGE: ${{ needs.image.outputs.backup_image }}
        shell: bash
        run: |
          set -euo pipefail
          release_env="release-assets/mindpattern-release-${GITHUB_REF_NAME:?missing Git ref name}.env"
          {
            echo "# Generated by the MindPattern release workflow."
            echo "# Format: deploy/release.env.example. This public fragment carries"
            echo "# only immutable image references; put deployment secrets in a"
            echo "# separate owner-only env file."
            printf 'MINDPATTERN_API_IMAGE=%s\n' "$MINDPATTERN_API_IMAGE"
            printf 'MINDPATTERN_BACKUP_IMAGE=%s\n' "$MINDPATTERN_BACKUP_IMAGE"
          } > "$release_env"
          ./deploy/verify-release-env.sh "$release_env"
          sha256sum "$release_env" > "$release_env.sha256"
      - name: Extract the CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/notes.md
          # Empty extraction is a release blocker: the notes ARE the
          # contract (what shipped and why).
          test -s /tmp/notes.md || { echo "no CHANGELOG.md section for $VERSION" >&2; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          files: |
            release-assets/mindpattern-portal-${{ github.ref_name }}.tar.gz
            release-assets/mindpattern-portal-${{ github.ref_name }}.tar.gz.sha256
            release-assets/mindpattern-web-${{ github.ref_name }}.tar.gz
            release-assets/mindpattern-web-${{ github.ref_name }}.tar.gz.sha256
            release-assets/mindpattern-release-${{ github.ref_name }}.env
            release-assets/mindpattern-release-${{ github.ref_name }}.env.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
