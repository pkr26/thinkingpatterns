name: Mutation testing

# Policy: deep mutation runs are scheduled, not per-PR. mutmut over the
# backend security + services cores means running the test suite once per
# mutant — far too slow for pull-request feedback, so PRs are gated by the
# coverage floors in ci.yml instead, and this workflow is the scheduled
# deep check. `mutmut run --CI` exits non-zero only on fatal errors, so the
# surviving-mutant ceiling step below parses the results and fails the run
# above MAX_SURVIVING_MUTANTS. The artifact is the deliverable for triage:
# Triage survivors against the pins in backend/tests/ (mutation-pin
# suites) and pin or document each one.
#
# The .mutmut-cache directory is cached between runs so a campaign that
# exceeds one job's time budget resumes where it stopped instead of
# restarting every week. Delete the cache (or change the key) after
# deliberately changing the mutation scope.

on:
  schedule:
    # Mondays 03:17 UTC — deliberately off the crowded :00/:30 marks.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut-backend:
    runs-on: ubuntu-latest
    # Long budget: mutation runs are resumable via the cache below, so an
    # incomplete run still makes durable progress.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.dev.lock.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements.dev.lock.txt
      - name: Restore mutmut progress cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/.mutmut-cache
          # Fresh key each run so the updated cache is saved at the end;
          # restore-keys falls back to the newest previous campaign state.
          key: mutmut-${{ github.run_id }}
          restore-keys: mutmut-
      - name: Run mutmut over the security + services cores
        working-directory: backend
        # scripts/mutmut_runner.sh is the per-mutant runner (configured in
        # pyproject.toml): it normalizes pytest collection crashes to kills.
        # --paths-to-mutate narrows pyproject's deep scope to the cores for
        # this scheduled run; widen it back only with the time budget to match.
        # `timeout` stops mutmut 30 min before the job limit so the collect/
        # upload steps below still run; mutmut's cache records each completed
        # mutant, so a stopped campaign resumes next week. A timeout shows
        # as a red run — that honestly means "campaign incomplete", and the
        # partial results artifact is still uploaded.
        run: timeout 270m mutmut run --paths-to-mutate app/security/,app/services/ --no-progress --CI
      - name: Collect results
        if: always()
        working-directory: backend
        run: mutmut results > mutmut-results.txt || true
      - name: Enforce the surviving-mutant ceiling (2026-09-21 audits H-4 + F-7)
        # The artifact alone let ANY survivor count pass — mobile decayed
        # 100 -> 82.7 under exactly this setup. Count survivors and fail
        # above the ceiling. Ratchet the ceiling DOWN as survivors are
        # killed; never raise it without a written reason.
        #
        # F-7: "Collect results" runs `mutmut results ... || true`, so a
        # crashed campaign or a corrupt cache can still hand this step an
        # empty or error-only file — which would count as 0 survivors and
        # pass the ceiling vacuously. Assert the results are real before
        # judging them.
        working-directory: backend
        env:
          MAX_SURVIVING_MUTANTS: 25
          # Floor on mutants the results file actually accounts for (the
          # "(N)" counts mutmut's status headers carry). Default 1 = "at
          # least one verified mutant": mutmut 2.4.4's `mutmut results`
          # prints one grouped status header per status — never one line
          # per mutant, and killed mutants are not listed at all — and no
          # real results sample exists in-repo to calibrate a higher
          # default against, so a larger one could brick the gate on a
          # healthy campaign. Raise it only against a measured run.
          MUTANTS_MIN_PROCESSED: "1"
        run: |
          python - <<'EOF'
          import os, re, sys
          text = open("mutmut-results.txt", encoding="utf-8", errors="replace").read()
          lines = text.splitlines()

          # Completeness (F-7): recognize every mutant-status marker
          # mutmut 2.4.4 can emit. `mutmut results` prints grouped
          # headers — "Survived 🙂 (N)", "Timed out ⏰ (N)",
          # "Suspicious 🤔 (N)", "Untested/skipped (N)" — while the run
          # legend / plain-text modes use the words and emoji below
          # (killed 🎉, survived 🙁, timeout ⏰, suspicious 🤔, skipped 🔇).
          # A file containing none of these is not a campaign report.
          status_words = ("survived", "killed", "timed out", "timeout",
                          "suspicious", "skipped", "untested")
          status_emoji = ("🙂", "🙁", "🎉", "⏰", "🤔", "🔇")
          status_lines = [
              line for line in lines
              if any(w in line.lower() for w in status_words)
              or any(e in line for e in status_emoji)
          ]
          if not status_lines:
              sys.exit(
                  "mutmut results missing or unparseable — campaign "
                  "incomplete; refusing to pass vacuously (audit F-7): no "
                  "recognizable mutant-status lines in mutmut-results.txt. "
                  "Check the mutmut run step and the .mutmut-cache before "
                  "trusting this gate."
              )
          # Sum the "(N)" counts the status headers carry: the mutants the
          # results file actually accounts for. Killed mutants are never
          # listed, so this undercounts a healthy campaign — keep the
          # floor conservative (see MUTANTS_MIN_PROCESSED above).
          accounted = sum(
              int(m.group(1))
              for m in (re.search(r"\((\d+)\)", line) for line in status_lines)
              if m
          )
          floor = int(os.environ["MUTANTS_MIN_PROCESSED"])
          print(
              f"status lines: {len(status_lines)}, "
              f"mutants accounted for: {accounted} (floor {floor})"
          )
          if accounted < floor:
              sys.exit(
                  f"campaign incomplete: only {accounted} mutants accounted "
                  f"for in mutmut-results.txt, below the MUTANTS_MIN_PROCESSED "
                  f"floor of {floor}."
              )
          # mutmut 2.4.4's `mutmut results` prints ONE grouped status
          # header — "Survived 🙁 (N)" — followed by filename groups and
          # bare id-range lines that carry no status word. Counting lines
          # that CONTAIN "survived" therefore always yields 1 (2026-09-22
          # audit round 3, NEW-1): a 500-survivor campaign parsed as 1 and
          # could never breach the ceiling. The header's own "(N)" is the
          # survivor count; the per-line count survives only as a fallback
          # for a hypothetical per-mutant listing format (where the header
          # would be absent).
          header_survivors = [
              int(m.group(1))
              for m in (re.search(r"(?i)^survived[^(\n]*\((\d+)\)", line) for line in lines)
              if m
          ]
          survivors = sum(header_survivors) if header_survivors else sum(
              1 for line in lines
              if "survived" in line.lower() or "🙂" in line or "🙁" in line
          )
          ceiling = int(os.environ["MAX_SURVIVING_MUTANTS"])
          print(f"surviving mutants: {survivors} (ceiling {ceiling})")
          if survivors > ceiling:
              sys.exit(
                  f"mutation floor breached: {survivors} surviving mutants > "
                  f"{ceiling}. Kill them (see mutmut-results.txt) or document "
                  "why the ceiling moves."
              )
          EOF
      - name: Upload mutmut results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results
          path: backend/mutmut-results.txt
          if-no-files-found: warn
